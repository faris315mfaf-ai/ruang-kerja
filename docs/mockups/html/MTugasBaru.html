<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas Baru Ponsel · Mockup RuangKerja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E11}
a{color:#2FC0B0}a:hover{color:#5FD6C4}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; color-scheme: dark; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #E7EEF1; background-color: #0A0E11; background-image: radial-gradient(800px 500px at 0% 0%, rgba(20,163,160,0.08), transparent 70%), radial-gradient(700px 500px at 100% 100%, rgba(47,123,234,0.07), transparent 70%)">

  <div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column">
    <div style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
      <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E7EEF1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 6px; background: #6B4FB8; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span>
      <span style="flex: 1; padding-left: 6px; font-size: 17px; font-weight: 600">Proyek Peluncuran Q4</span>
    </div>
    <div style="margin: 4px 68px 12px 16px; height: 40px; border-radius: 10px; background: #10161A; border: 1px solid #1F292F; display: flex; padding: 3px; box-sizing: border-box">
      <span style="flex: 1; border-radius: 7px; background: #1F292F; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">Board</span>
      <span style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8C9CA4">List</span>
      <span style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8C9CA4">Kalender</span>
    </div>
    <div style="height: 44px; display: flex; align-items: flex-end; gap: 20px; padding: 0 16px; border-bottom: 1px solid #1F292F; font-size: 13px; color: #8C9CA4">
      <span style="padding-bottom: 12px">Todo 4</span>
      <span style="padding-bottom: 10px; border-bottom: 2px solid #2FC0B0; color: #E7EEF1; font-weight: 600">Sedang dikerjakan 3</span>
      <span style="padding-bottom: 12px">Review 2</span>
    </div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 104px; border-radius: 12px; background: #10161A; border: 1px solid #1F292F; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C9CA4">PLQ-18</span>
        <span style="font-size: 15px; font-weight: 500">Finalisasi anggaran peluncuran</span>
      </div>
      <div style="height: 120px; border-radius: 12px; background: #10161A; border: 1px solid #1F292F; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C9CA4">PLQ-21</span>
        <span style="font-size: 15px; font-weight: 500">Landing page produk baru</span>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,8,10,0.6)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="judul-sheet" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0; padding: 8px 16px 24px; background: #10161A; border-top: 1px solid #2B373E; box-shadow: 0 -12px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #2B373E"></span>

    <div style="display: flex; align-items: center; gap: 8px; margin: -6px -8px -4px 0">
      <h1 id="judul-sheet" style="margin: 0; flex: 1; font-size: 17px; line-height: 24px; font-weight: 600">Tugas baru</h1>
      <button type="button" aria-label="Tutup" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center; color: #C3CED3; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>

    <label style="display: flex; flex-direction: column">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Judul tugas</span>
      <input type="text" value="Konfirmasi katering acara peluncuran" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #2FC0B0; box-shadow: 0 0 0 3px rgba(47,192,176,0.18); background: #0A0E11; color: #E7EEF1; font: inherit; font-size: 16px; font-weight: 600">
    </label>

    <div role="group" aria-label="Properti tugas" style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" aria-label="Status: Todo, ubah" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#C3CED3" stroke-width="1.5"></circle></svg>Todo</button>
      <button type="button" aria-label="Prioritas: Sedang, ubah" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="8" width="3" height="5" rx="1" fill="#C3CED3"></rect><rect x="5.5" y="5" width="3" height="8" rx="1" fill="#C3CED3"></rect><rect x="10" y="2" width="3" height="11" rx="1" fill="#3A464D"></rect></svg>Sedang</button>
      <button type="button" aria-label="Penanggung jawab: Saya, ubah" style="height: 36px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; background: #0A6C78; color: #FFFFFF; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center">DP</span>Saya</button>
      <button type="button" aria-expanded="true" aria-controls="tenggat-cepat" aria-label="Tenggat: belum dipilih" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(47,192,176,0.45); background: rgba(47,192,176,0.10); color: #5FD6C4; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Pilih tanggal</button>
      <button type="button" aria-label="Label: belum ada, tambah" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px dashed #2B373E; background: transparent; color: #8C9CA4; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Label</button>
    </div>

    <div id="tenggat-cepat" role="group" aria-label="Pilih tenggat cepat" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #0A0E11; border: 1px solid #1F292F">
      <span style="font-size: 12px; line-height: 16px; color: #8C9CA4; font-weight: 500">Tenggat</span>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 16px; cursor: pointer">Hari ini<span style="font-size: 11px; color: #8C9CA4; font-weight: 400">Sen 5</span></button>
        <button type="button" style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 16px; cursor: pointer">Besok<span style="font-size: 11px; color: #8C9CA4; font-weight: 400">Sel 6</span></button>
        <button type="button" style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 16px; cursor: pointer">Jum<span style="font-size: 11px; color: #8C9CA4; font-weight: 400">9 Okt</span></button>
        <button type="button" style="flex: 1; height: 44px; border-radius: 8px; border: 1px dashed #2B373E; background: transparent; color: #C3CED3; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Pilih…</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500; color: #C3CED3">Deskripsi <span style="font-weight: 400; color: #8C9CA4">(opsional)</span></span>
      <textarea rows="3" placeholder="Tambahkan detail singkat, mis. jumlah tamu atau menu khusus" style="min-height: 80px; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #2B373E; background: #0A0E11; color: #E7EEF1; font: inherit; font-size: 16px; line-height: 22px; resize: none"></textarea>
    </label>

    <button type="button" aria-label="Workspace: Proyek Peluncuran Q4, ubah" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #2B373E; background: #151C21; color: #E7EEF1; font: inherit; text-align: left; cursor: pointer">
      <span style="font-size: 13px; color: #8C9CA4">Workspace</span>
      <span style="flex: 1"></span>
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 5px; background: #6B4FB8; color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span>
      <span style="font-weight: 500">Proyek Peluncuran Q4</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C9CA4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 48px; border: 0; border-radius: 10px; background: #2FC0B0; color: #04201F; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        Buat tugas
      </button>
      <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; line-height: 16px; color: #8C9CA4">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
        Tugas langsung muncul di board tim
      </p>
    </div>
  </section>
</div>
</body>
</html>
