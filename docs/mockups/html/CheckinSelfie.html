<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selfie Check-in · Mockup RuangKerja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E11}
a{color:#2FC0B0}a:hover{color:#5FD6C4}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #E7EEF1; font-size: 14px; line-height: 20px; background: #0A0E11; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px">
    <button type="button" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; color: #E7EEF1; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </button>
    <div style="flex: 1; text-align: center">
      <h1 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">Selfie check-in</h1>
      <p style="margin: 0; font-size: 12px; line-height: 16px; color: #8C9CA4">Shift Reguler · masuk 08.00</p>
    </div>
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #C3CED3">07.52</span>
  </header>

  <main style="flex: 1; padding: 4px 12px 0; display: flex; flex-direction: column; min-height: 0">
    <section aria-label="Pratinjau kamera depan" style="position: relative; flex: 1; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #1a2328 0%, #0a0e11 100%); border: 1px solid #1F292F">
      <div style="position: absolute; inset: 0; background: radial-gradient(260px 300px at 50% 42%, rgba(255,255,255,0.05), transparent 70%)"></div>

      <div style="position: absolute; top: 14px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center">
        <span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(16,22,26,0.66); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.07); font-size: 13px">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: #3CCB86; box-shadow: 0 0 0 3px rgba(60,203,134,0.18)"></span>
          <span style="font-weight: 500">Kantor Pusat</span>
          <span style="color: #8C9CA4">·</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">38 m</span>
          <span style="color: #8C9CA4">·</span>
          <span style="color: #3CCB86">dalam radius</span>
        </span>
      </div>

      <div aria-hidden="true" style="position: absolute; left: 50%; top: 46%; width: 0; height: 0">
        <div style="position: absolute; left: -62px; top: -118px; width: 124px; height: 150px; border-radius: 50% 50% 46% 46%; background: linear-gradient(180deg, #33424A, #26323A)"></div>
        <div style="position: absolute; left: -26px; top: 22px; width: 52px; height: 40px; background: #26323A"></div>
        <div style="position: absolute; left: -140px; top: 52px; width: 280px; height: 420px; border-radius: 140px 140px 0 0; background: linear-gradient(180deg, #2C3940, #1C252B)"></div>
      </div>

      <div aria-hidden="true" style="position: absolute; left: 50%; top: 46%; width: 228px; height: 300px; margin: -150px 0 0 -114px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.75); box-shadow: 0 0 0 999px rgba(5,8,10,0.38)"></div>

      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: rgba(16,22,26,0.66); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.07)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C3CED3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
        <span style="font-size: 13px; color: #C3CED3">Pastikan wajah terlihat jelas dan tidak memakai masker.</span>
      </div>
    </section>
  </main>

  <div style="padding: 20px 24px 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px">
    <button type="button" style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 56px; padding: 6px 8px; border: 0; border-radius: 12px; background: transparent; color: #C3CED3; font: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #151C21; border: 1px solid #2B373E; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M21 21v.01"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path><path d="M3 12h.01"></path><path d="M12 3h.01"></path><path d="M12 16v.01"></path><path d="M16 12h1"></path><path d="M21 12v.01"></path><path d="M12 21v-1"></path></svg>
      </span>
      Pindai QR
    </button>
    <button type="button" aria-label="Ambil foto" style="width: 72px; height: 72px; border-radius: 999px; border: 3px solid #E7EEF1; background: transparent; padding: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <span style="width: 100%; height: 100%; border-radius: 999px; background: #E7EEF1"></span>
    </button>
    <button type="button" style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 56px; padding: 6px 8px; border: 0; border-radius: 12px; background: transparent; color: #C3CED3; font: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #151C21; border: 1px solid #2B373E; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
      </span>
      Ganti kamera
    </button>
  </div>
</div>
</body>
</html>
