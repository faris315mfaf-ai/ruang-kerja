<div class="a12-stage">
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Notifikasi tepat waktu</div></div><div class="pad stack" style="padding-top:16px"><div class="card"><div class="row-h"><span class="a12-ico-s" style="width:48px;height:48px;border-radius:16px;background:var(--warn-soft);color:var(--warn)"><i data-i="battery-warning" data-s="26"></i></span><div class="grow"><div class="t-title">Hemat daya aktif</div><div class="a12-sub">Pengingat check-in dan rapat bisa terlambat.</div></div></div></div>
    <div class="card flush list"><div class="li"><span class="ico teal"><i data-i="battery-charging"></i></span><div class="grow"><div class="t">Penggunaan baterai</div><div class="m">Dioptimalkan (disarankan)</div></div></div><div class="li"><span class="ico blue"><i data-i="rocket"></i></span><div class="grow"><div class="t">Mulai otomatis (beberapa merek)</div><div class="m">Xiaomi, Oppo, Vivo: izinkan agar notifikasi terkirim saat aplikasi ditutup</div></div></div></div>
    <button class="btn primary block">Buka pengaturan baterai</button><div class="hint">Notifikasi dikirim lewat FCM prioritas tinggi; kami tidak membutuhkan aplikasi selalu berjalan di latar.</div></div></div></div><figcaption class="a12-cap"><b>1 · Panduan dalam aplikasi.</b> Hanya muncul bila ada gejala (Hemat daya aktif atau notifikasi sering tertunda). Tombol membuka <code>ACTION_APPLICATION_DETAILS_SETTINGS</code>; tidak meminta pengecualian baterai langsung.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="a12-set"><div class="bar-sub" style="background:transparent;border:0"><button class="ibtn"><i data-i="arrow-left"></i></button></div><div class="row" style="padding-top:0"><span><div class="a12-mark" style="width:44px;height:44px;border-radius:34%;overflow:hidden;position:relative;"><svg style="position:absolute;left:-11px;top:-11px;width:66px;height:66px" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div></span><div><div class="t" style="font-size:20px;font-weight:600">RuangKerja</div><div class="m">Penggunaan baterai aplikasi</div></div></div><div class="grp" style="margin-top:8px"><div class="a12-radiorow"><span class="radio"></span><div><div class="t" style="font-size:17px;font-weight:600">Tidak dibatasi</div><div class="a12-sub">Pemakaian baterai bisa lebih banyak</div></div></div><div class="a12-radiorow"><span class="radio on"></span><div><div class="t" style="font-size:17px;font-weight:600">Dioptimalkan</div><div class="a12-sub">Mengoptimalkan berdasarkan penggunaan (disarankan)</div></div></div><div class="a12-radiorow"><span class="radio"></span><div><div class="t" style="font-size:17px;font-weight:600">Dibatasi</div><div class="a12-sub">Menghemat baterai; notifikasi dapat tertunda</div></div></div></div><div class="grp" style="margin-top:14px"><div class="row"><div class="grow"><div class="t">Jeda aktivitas aplikasi jika tidak digunakan</div><div class="m">Mencabut izin dan menghentikan notifikasi bila tak dibuka berminggu-minggu</div></div><span class="switch" style="transform:scale(.85)"></span></div></div></div></div></div><figcaption class="a12-cap"><b>2 · Info aplikasi › Baterai.</b> Nilai bawaan "Dioptimalkan" sudah cukup untuk FCM prioritas tinggi. "Jeda aktivitas…" harus mati (matikan di sini) agar pengingat tak hilang; aplikasi memberi tahu bila terdeteksi aktif (<code>Android 11+</code>).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Notifikasi tepat waktu</div></div><div class="skel" style="margin:16px;height:300px;border-radius:26px"></div></div><div class="scrim"></div><div class="a12-sd" style="top:50%"><div class="ic"><i data-i="battery-charging"></i></div><div class="tt">Biarkan RuangKerja selalu berjalan di latar belakang?</div><div class="ds">Dapat menambah pemakaian baterai.</div><div class="a12-sdb"><span class="pri">Izinkan</span><span class="dn">Tolak</span></div></div></div><figcaption class="a12-cap"><b>3 · Dialog pengecualian baterai</b> (<code>REQUEST_IGNORE_BATTERY_OPTIMIZATIONS</code>). <b>Tidak disarankan:</b> kebijakan Google Play membatasinya untuk aplikasi yang inti fungsinya butuh latar (alarm, pesan instan); RuangKerja memakai FCM. Ditampilkan agar pemilik memutuskan (lihat spec).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Mulai otomatis</div></div><div class="pad stack" style="padding-top:16px"><div class="banner warn"><i data-i="triangle-alert" data-s="22"></i><span>Ponsel Anda (Xiaomi) menutup aplikasi di latar. Aktifkan <b>Mulai otomatis</b> dan pilih <b>Tanpa batasan</b> agar pengingat tetap tiba.</span></div>
    <div class="card flush list"><div class="li"><span class="badge nodot" style="width:32px;justify-content:center">1</span><div class="grow"><div class="t" style="font-size:16px;line-height:22px">Buka Keamanan › Izin › Mulai otomatis</div></div></div><div class="li"><span class="badge nodot" style="width:32px;justify-content:center">2</span><div class="grow"><div class="t" style="font-size:16px;line-height:22px">Aktifkan untuk RuangKerja</div></div></div><div class="li"><span class="badge nodot" style="width:32px;justify-content:center">3</span><div class="grow"><div class="t" style="font-size:16px;line-height:22px">Baterai › Hemat daya aplikasi › Tanpa batasan</div></div></div></div><button class="btn outline block">Buka pengaturan</button><div class="hint">Panduan hanya muncul pada merek yang dikenal (Xiaomi, Oppo, Vivo, Huawei, Samsung).</div></div></div></div><figcaption class="a12-cap"><b>4 · Panduan per merek.</b> Terdeteksi dari <code>expo-device</code> (<code>manufacturer</code>); teks singkat 3 langkah, tanpa tangkapan layar yang cepat basi.</figcaption></figure>
</div>
