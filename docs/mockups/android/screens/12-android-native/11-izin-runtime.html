<body>
<div class="a12-stage">
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div style="padding:60px 24px 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center"><span class="a12-ico-s" style="width:96px;height:96px;border-radius:30px;background:var(--grad-soft);color:var(--link)"><i data-i="map-pin" data-s="44"></i></span><h1 class="t-h1">Lokasi untuk absen</h1><div class="muted" style="font-size:17px;line-height:25px">RuangKerja hanya membaca lokasi saat Anda check-in dan check-out, untuk memastikan Anda berada di area kerja. Tidak ada pelacakan terus-menerus.</div></div></div><div class="bottom-bar" style="flex-direction:column"><button class="btn primary block">Lanjutkan</button><button class="btn quiet block">Nanti saja</button></div></div><figcaption class="a12-cap"><b>1 · Penjelasan sebelum izin lokasi</b> (layar kita sendiri, sebelum dialog sistem). Singkat, menyebut tujuan; persetujuan UU PDP berversi (modul 03) tetap terpisah dan wajib sebelum check-in.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Absen masuk</div></div><div class="pad stack" style="padding-top:14px"><div class="map" style="height:200px"></div><div class="skel" style="height:64px;border-radius:20px"></div><div class="skel" style="height:96px;border-radius:20px"></div></div></div><div class="scrim"></div><div class="a12-sd" style="top:48%"><div class="ic"><i data-i="map-pin"></i></div><div class="tt">Izinkan RuangKerja mengakses lokasi perangkat ini?</div><div class="a12-prec"><div class="on"><div class="map"><span class="circ" style="width:30px;height:30px"></span><span class="pin"><i data-i="map-pin" data-s="22"></i></span></div>Tepat</div><div class=""><div class="map"><span class="circ"></span></div>Perkiraan</div></div><div class="a12-sdb"><span class="pri">Saat aplikasi sedang digunakan</span><span class="">Hanya kali ini</span><span class="dn">Jangan izinkan</span></div></div></div><figcaption class="a12-cap"><b>2 · Dialog izin lokasi (Android 12+).</b> Pengguna memilih Tepat atau Perkiraan. Absen butuh <b>Tepat</b> (<code>ACCESS_FINE_LOCATION</code>); jangan meminta latar (<code>ACCESS_BACKGROUND_LOCATION</code>) — tidak dibutuhkan.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Absen masuk</div></div><div class="pad stack" style="padding-top:14px"><div class="map" style="height:200px"></div><div class="skel" style="height:64px;border-radius:20px"></div><div class="skel" style="height:96px;border-radius:20px"></div></div></div><div class="scrim"></div><div class="a12-sd" style="top:50%"><div class="ic"><i data-i="camera"></i></div><div class="tt">Izinkan RuangKerja mengambil gambar dan merekam video?</div><div class="a12-sdb"><span class="pri">Saat aplikasi sedang digunakan</span><span class="">Hanya kali ini</span><span class="dn">Jangan izinkan</span></div></div></div><figcaption class="a12-cap"><b>3 · Dialog izin kamera.</b> Hanya untuk selfie absen dan lampiran foto. Teks sistem tidak bisa diubah; teks Indonesia ikut bahasa sistem.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Beranda</div></div><div class="skel" style="margin:16px;height:240px;border-radius:26px"></div></div><div class="scrim"></div><div class="a12-sd" style="top:50%"><div class="ic"><i data-i="bell"></i></div><div class="tt">Izinkan RuangKerja mengirim notifikasi kepada Anda?</div><div class="a12-sdb"><span class="pri">Izinkan</span><span class="dn">Jangan izinkan</span></div></div></div><figcaption class="a12-cap"><b>4 · Dialog izin notifikasi (Android 13+).</b> Diminta setelah masuk pertama kali dan setelah penjelasan (nilai: pengingat check-in, persetujuan, rapat) — jangan saat peluncuran dingin sebelum konteks.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Catatan</div></div><div class="skel" style="margin:16px;height:240px;border-radius:26px"></div></div><div class="scrim"></div><div class="a12-sd" style="top:50%"><div class="ic"><i data-i="mic"></i></div><div class="tt">Izinkan RuangKerja merekam audio?</div><div class="a12-sdb"><span class="pri">Saat aplikasi sedang digunakan</span><span class="">Hanya kali ini</span><span class="dn">Jangan izinkan</span></div></div></div><figcaption class="a12-cap"><b>5 · Dialog izin mikrofon.</b> Hanya untuk dikte catatan (modul 07) dan, bila nanti ruang video dibuat native, rapat. Rapat video v1 di peramban tidak butuh izin ini di aplikasi; <b>jangan</b> memasang <code>RECORD_AUDIO</code> bila belum dipakai (expo-camera menambahkannya kecuali <code>recordAudioAndroid: false</code>).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Absen masuk</div></div><div style="padding:50px 20px"><div class="empty"><div class="ic" style="background:var(--warn-soft);color:var(--warn)"><i data-i="map-pin-off" data-s="30"></i></div><div class="t-h3">Izin lokasi diperlukan</div><div class="muted" style="font-size:15px;line-height:22px">Tanpa lokasi, kami tidak bisa memastikan Anda berada di area kerja. Anda bisa mengizinkannya lagi.</div><button class="btn primary">Coba izinkan lagi</button><button class="btn quiet">Ajukan koreksi absensi</button></div></div></div></div><figcaption class="a12-cap"><b>6 · Ditolak sekali.</b> Masih bisa diminta lagi (<code>canAskAgain</code> benar). Alternatif tanpa izin: pengajuan koreksi absensi.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Absen masuk</div></div><div style="padding:50px 20px"><div class="empty"><div class="ic" style="background:var(--bad-soft);color:var(--bad)"><i data-i="camera-off" data-s="30"></i></div><div class="t-h3">Izin kamera dimatikan</div><div class="muted" style="font-size:15px;line-height:22px">Android tidak lagi menampilkan permintaan izin. Buka Pengaturan › Izin › Kamera lalu pilih "Saat aplikasi digunakan".</div><button class="btn primary">Buka pengaturan</button><button class="btn quiet">Lewati selfie (tidak bisa absen)</button></div></div></div></div><figcaption class="a12-cap"><b>7 · Ditolak permanen.</b> <code>canAskAgain</code> salah → tombol <code>Linking.openSettings()</code>; aplikasi memeriksa ulang izin saat kembali ke latar depan.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="a12-set"><div class="bar-sub" style="background:transparent;border:0"><button class="ibtn"><i data-i="arrow-left"></i></button></div><div class="row" style="padding-top:0"><span class="si on"><i data-i="camera" data-s="22"></i></span><div><div class="t" style="font-size:20px;font-weight:600">Izin kamera</div><div class="m">RuangKerja</div></div></div><div class="sec">Akses kamera untuk aplikasi ini</div><div class="grp"><div class="a12-radiorow"><span class="radio on"></span><div class="t" style="font-size:17px;font-weight:600">Izinkan hanya saat aplikasi digunakan</div></div><div class="a12-radiorow"><span class="radio"></span><div class="t" style="font-size:17px;font-weight:600">Tanya setiap kali</div></div><div class="a12-radiorow"><span class="radio"></span><div class="t" style="font-size:17px;font-weight:600">Jangan izinkan</div></div></div><div class="sec" style="padding-top:20px">Izin lain</div><div class="grp"><div class="row"><span class="si"><i data-i="map-pin" data-s="22"></i></span><div class="grow"><div class="t">Lokasi</div><div class="m">Diizinkan hanya saat digunakan · Tepat</div></div></div><div class="row"><span class="si"><i data-i="bell" data-s="22"></i></span><div class="grow"><div class="t">Notifikasi</div><div class="m">Diizinkan</div></div></div></div></div></div></div><figcaption class="a12-cap"><b>8 · Pengaturan Android › Izin.</b> Tujuan tombol "Buka pengaturan". Android 11+ otomatis mencabut izin bila aplikasi tak dibuka berbulan-bulan ("Jeda aktivitas aplikasi"); lihat 12.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Absen masuk</div></div><div class="pad stack" style="padding-top:14px"><div class="banner warn"><i data-i="locate-off" data-s="22"></i><div><b>Lokasi perkiraan tidak cukup</b><br>Absen butuh lokasi Tepat. Ubah izin lokasi RuangKerja ke "Gunakan lokasi tepat".<div style="margin-top:8px"><span class="btn sm outline" style="display:inline-flex">Ubah izin</span></div></div></div><div class="map" style="height:180px"><span style="position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(30,95,214,.15);border:2px solid var(--blue)"></span></div><div class="card tight"><div class="row-h"><i data-i="crosshair" data-s="22"></i><div class="grow"><div class="t-label">Akurasi 1,8 km</div><div class="a12-sub">Radius kantor 100 m</div></div><span class="badge bad">Terlalu kasar</span></div></div></div><div class="bottom-bar"><button class="btn off block">Check-in</button></div></div></div><figcaption class="a12-cap"><b>9 · Lokasi perkiraan dipilih.</b> Server menandai akurasi > 100 m (<code>low_accuracy</code>); klien mencegahnya lebih awal (<code>accuracy</code> dari <code>expo-location</code>) dengan pesan jelas.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><button class="ibtn"><i data-i="arrow-left"></i></button><div class="ttl">Izin aplikasi</div></div><div class="pad stack" style="padding-top:14px"><div class="card flush list"><div class="li"><span class="ico teal"><i data-i="camera"></i></span><div class="grow"><div class="t">Kamera</div><div class="m">Selfie absen & lampiran foto</div></div><span class="badge ok">Diizinkan</span></div><div class="li"><span class="ico teal"><i data-i="map-pin"></i></span><div class="grow"><div class="t">Lokasi (tepat)</div><div class="m">Hanya saat check-in/out</div></div><span class="badge ok">Diizinkan</span></div><div class="li"><span class="ico teal"><i data-i="bell"></i></span><div class="grow"><div class="t">Notifikasi</div><div class="m">Pengingat & persetujuan</div></div><span class="badge ok">Diizinkan</span></div><div class="li"><span class="ico "><i data-i="mic"></i></span><div class="grow"><div class="t">Mikrofon</div><div class="m">Dikte catatan</div></div><span class="badge ">Belum diminta</span></div><div class="li"><span class="ico teal"><i data-i="fingerprint"></i></span><div class="grow"><div class="t">Biometrik</div><div class="m">Kunci aplikasi</div></div><span class="badge ok">Aktif</span></div></div><button class="btn outline block">Buka pengaturan Android</button><div class="hint">Lokasi dan selfie hanya dibaca saat absen; dapat dicabut kapan saja (Data Saya › Persetujuan, modul 01).</div></div></div></div><figcaption class="a12-cap"><b>10 · Ringkasan izin di Pengaturan aplikasi.</b> Status nyata dibaca dari sistem; baris Mikrofon "Belum diminta" muncul hanya bila fitur dikte aktif.</figcaption></figure>
</div>
