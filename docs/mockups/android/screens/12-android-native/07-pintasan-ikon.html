<figure class="a12-fig" style="--w:412px"><div class="phone a12-home" style="--w:412px;--h:915px;"><div class="body"><div class="a12-glance"><div class="d">Sel, 13 Okt</div><div class="w"><i data-i="cloud-sun" data-s="16"></i> 29°C · Jakarta</div></div><div class="a12-appgrid"><div class="a12-app" style="position:relative"><div style="position:relative;width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--link);box-shadow:var(--shadow-card)"><i data-i="fingerprint" data-s="28"></i><span style="position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center"><span style="display:block;width:16px;height:16px;border-radius:50%;overflow:hidden"><div class="a12-mark" style="width:16px;height:16px;border-radius:50%;overflow:hidden;position:relative;"><svg style="position:absolute;left:-4px;top:-4px;width:24px;height:24px" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div></span></span></div>Check-in</div><div class="a12-app" ><div style="position:relative"><div class="a12-mark" style="width:56px;height:56px;border-radius:34%;overflow:hidden;position:relative;"><svg style="position:absolute;left:-14px;top:-14px;width:84px;height:84px" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div><span class="a12-badge-app">3</span></div>RuangKerja</div><div class="a12-app"><div class="a12-ai "><i data-i="calendar-days" data-s="26"></i></div>Kalender</div><div class="a12-app"><div class="a12-ai "><i data-i="map" data-s="26"></i></div>Peta</div></div><div class="a12-dots"><i class="on"></i><i class=""></i><i class=""></i></div><div class="a12-dockbg"><div class="a12-dock"><div class="a12-ai sq"><i data-i="phone" data-s="26"></i></div><div class="a12-ai sq"><i data-i="message-square" data-s="26"></i></div><div class="a12-ai sq"><i data-i="camera" data-s="26"></i></div><div class="a12-ai sq"><i data-i="globe" data-s="26"></i></div></div></div><div class="a12-search"><i data-i="search" data-s="22"></i><span>Telusuri</span><span style="margin-left:auto"><i data-i="mic" data-s="22"></i></span></div></div></div><figcaption class="a12-cap"><b>2 · Seret pintasan ke layar utama.</b> Pintasan tersemat (<code>requestPinShortcut</code>) memakai ikon fingerprint + lencana kecil RuangKerja; label dinamis ("Check-out") ikut berubah setelah absen masuk.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-home" style="--w:412px;--h:915px;"><div class="body"><div style="padding:8px 14px;display:flex;flex-direction:column;gap:2px">
    <div style="font-size:13px;font-weight:700;color:var(--a12-ink);margin:6px 8px 4px">Sebelum absen masuk</div><div class="a12-popup" style="position:static;width:262px"><div class="a12-sc" style="height:46px"><span class="si"><i data-i="fingerprint" data-s="20"></i></span><div style="line-height:18px">Check-in</div></div><div class="a12-sc" style="height:46px"><span class="si"><i data-i="plus" data-s="20"></i></span><div style="line-height:18px">Tugas baru</div></div></div>
    <div style="font-size:13px;font-weight:700;color:var(--a12-ink);margin:6px 8px 4px">Sudah absen masuk (sampai pulang)</div><div class="a12-popup" style="position:static;width:262px"><div class="a12-sc" style="height:46px"><span class="si"><i data-i="log-out" data-s="20"></i></span><div style="line-height:18px">Check-out</div></div><div class="a12-sc" style="height:46px"><span class="si"><i data-i="plus" data-s="20"></i></span><div style="line-height:18px">Tugas baru</div></div></div>
    <div style="font-size:13px;font-weight:700;color:var(--a12-ink);margin:6px 8px 4px">Belum masuk akun / sesi berakhir</div><div class="a12-popup" style="position:static;width:262px"><div class="a12-sc dis" style="height:56px"><span class="si"><i data-i="fingerprint" data-s="20"></i></span><div style="line-height:18px">Check-in<div class="a12-sub" style="font-size:12px;line-height:14px">Masuk dulu untuk memakai pintasan</div></div></div><div class="a12-sc dis" style="height:56px"><span class="si"><i data-i="plus" data-s="20"></i></span><div style="line-height:18px">Tugas baru<div class="a12-sub" style="font-size:12px;line-height:14px">Masuk dulu untuk memakai pintasan</div></div></div></div>
    <div style="font-size:13px;font-weight:700;color:var(--a12-ink);margin:6px 8px 4px">Aplikasi terkunci biometrik</div><div class="a12-popup" style="position:static;width:262px"><div class="a12-sc" style="height:56px"><span class="si"><i data-i="fingerprint" data-s="20"></i></span><div style="line-height:18px">Check-in<div class="a12-sub" style="font-size:12px;line-height:14px">Verifikasi dulu saat dibuka</div></div></div></div></div></div></div><figcaption class="a12-cap"><b>3 · Varian pintasan menurut keadaan.</b> Pintasan non-aktif (<code>setDisabledMessage</code>) bila belum masuk; bila aplikasi terkunci, pintasan tetap jalan tetapi layar kunci biometrik muncul lebih dulu (tujuan dipertahankan).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="bar-sub"><div class="ttl">Peta pintasan → rute</div></div><div class="pad stack" style="padding-top:16px"><div class="card flush list"><div class="li" style="align-items:flex-start"><span class="ico teal"><i data-i="fingerprint"></i></span><div class="grow"><div class="t">Check-in / Check-out</div><div class="mono" style="font-size:13px;color:var(--link);line-height:20px">ruangkerja://absen?mulai=1</div><div class="m">Tab Absen → biometrik → kamera. Berubah jadi Check-out setelah masuk.</div></div></div><div class="li" style="align-items:flex-start"><span class="ico teal"><i data-i="plus"></i></span><div class="grow"><div class="t">Tugas baru</div><div class="mono" style="font-size:13px;color:var(--link);line-height:20px">ruangkerja://tugas/baru</div><div class="m">Form buat tugas (workspace Pribadi dulu).</div></div></div><div class="li" style="align-items:flex-start"><span class="ico teal"><i data-i="clipboard-pen-line"></i></span><div class="grow"><div class="t">Tulis laporan</div><div class="mono" style="font-size:13px;color:var(--link);line-height:20px">ruangkerja://laporan/hari-ini</div><div class="m">Laporan progres harian; hanya tersedia hari kerja.</div></div></div><div class="li" style="align-items:flex-start"><span class="ico teal"><i data-i="search"></i></span><div class="grow"><div class="t">Cari</div><div class="mono" style="font-size:13px;color:var(--link);line-height:20px">ruangkerja://cari</div><div class="m">Layar cari, kolom di bawah (zona jempol), keyboard terbuka.</div></div></div></div>
    <div class="banner"><i data-i="info" data-s="20"></i><span>Maksimal 4 pintasan tampil di peluncur. Pintasan dinamis yang dibuat dari kode tidak boleh memuat data pribadi di label. Versi Expo: <code>expo-quick-actions</code> (Android) atau <code>shortcuts.xml</code> via config plugin.</span></div></div></div></div><figcaption class="a12-cap"><b>4 · Pemetaan pintasan ke rute.</b> Semua rute ada di <code>expo-router</code> kecuali <code>/laporan/hari-ini</code> dan <code>/cari</code> (<b>BELUM ADA</b> di <code>apps/mobile/app</code>).</figcaption></figure>
