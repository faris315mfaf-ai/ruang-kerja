<figure class="a12-fig" style="--w:412px"><div class="phone a12-nosb" style="--w:412px;--h:915px;"><div class="a12-sheet" style="inset:20px 0 0 0"><div style="display:flex;align-items:center;gap:10px"><button class="ibtn" style="box-shadow:none"><i data-i="arrow-left"></i></button><div class="t-h3">Keamanan data</div></div><div class="a12-sub" style="margin:8px 4px 14px">Keamanan bergantung pada cara pengembang mengumpulkan dan membagikan data Anda.</div><div class="stack" style="gap:12px"><div class="card stack" style="gap:10px"><div class="t-title">Tidak ada data dibagikan</div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="share-2" data-s="20"></i></span><div class="grow"><div class="t-label">Tidak membagikan data dengan pihak ketiga</div><div class="a12-sub" style="font-size:14px;line-height:20px">Layanan penyedia (Firebase Cloud Messaging, Google Workspace organisasi) memproses atas nama SPKD.</div></div></div></div><div class="card stack" style="gap:10px"><div class="t-title">Data yang dikumpulkan</div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="map-pin" data-s="20"></i></span><div class="grow"><div class="t-label">Lokasi</div><div class="a12-sub" style="font-size:14px;line-height:20px">Perkiraan dan tepat · hanya saat check-in/out</div></div></div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="image" data-s="20"></i></span><div class="grow"><div class="t-label">Foto</div><div class="a12-sub" style="font-size:14px;line-height:20px">Selfie absen · lampiran</div></div></div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="user" data-s="20"></i></span><div class="grow"><div class="t-label">Info pribadi</div><div class="a12-sub" style="font-size:14px;line-height:20px">Nama, email, ID karyawan</div></div></div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="message-square" data-s="20"></i></span><div class="grow"><div class="t-label">Pesan</div><div class="a12-sub" style="font-size:14px;line-height:20px">Obrolan dalam aplikasi</div></div></div></div><div class="card stack" style="gap:10px"><div class="t-title">Praktik keamanan</div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="lock" data-s="20"></i></span><div class="grow"><div class="t-label">Data dienkripsi saat dikirim</div><div class="a12-sub" style="font-size:14px;line-height:20px">HTTPS (TLS)</div></div></div><div class="row-h" style="align-items:flex-start;gap:14px"><span class="ico  li" style="display:contents"></span><span class="a12-ico-s" style="width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--text-muted)"><i data-i="trash-2" data-s="20"></i></span><div class="grow"><div class="t-label">Anda dapat meminta data dihapus</div><div class="a12-sub" style="font-size:14px;line-height:20px">Lewat HR atau Data Saya</div></div></div></div></div></div></div><figcaption class="a12-cap"><b>2 · Keamanan data (ringkasan di halaman produk).</b> Isi formulir Data safety: lihat tabel di spesifikasi. Tidak ada pembagian data ke pihak ketiga; data dikirim terenkripsi; pengguna dapat meminta penghapusan (Data Saya).</figcaption></figure>
