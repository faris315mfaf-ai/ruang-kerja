imary grow">Selalu</button></div><div class="a12-sub" style="margin-top:10px;text-align:center">Hanya tampil bila domain belum terverifikasi (Android 12+ langsung membuka aplikasi bila terverifikasi).</div></div></div><figcaption class="a12-cap"><b>1 · Ketuk tautan di aplikasi lain.</b> Dengan <code>assetlinks.json</code> yang valid (sudah ada di server: <code>/.well-known/assetlinks.json</code>) dan <code>autoVerify</code>, Android 12+ langsung membuka RuangKerja tanpa pemilih. Pemilih hanya muncul bila verifikasi gagal.</figcaption></figure>
