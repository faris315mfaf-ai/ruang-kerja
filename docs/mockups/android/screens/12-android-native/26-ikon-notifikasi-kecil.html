>mdpi 24 · hdpi 36 · xhdpi 48 · xxhdpi 72 · xxxhdpi 96 px</div></div></div><figcaption class="a12-cap"><b>1 · Ikon notifikasi kecil (status bar) — monokrom.</b> Siluet putih di atas transparan, kanvas 24dp dengan area aktif 20dp; satu bentuk sederhana (rute: dua titik dan garis) agar terbaca di 16dp. Android mewarnai dengan warna aksen (<code>notification.color</code> = <code>#0B7F86</code>) di header notifikasi.</figcaption></figure>
