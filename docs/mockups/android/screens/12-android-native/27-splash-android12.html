<div class="a12-stage">
<figure class="a12-fig" style="--w:412px"><div class="phone a12-immersive " style="--w:412px;--h:915px;" data-gestur="tidak"><div class="a12-splash"><div style="width:160px;height:160px;border-radius:50%;background:var(--grad-active);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn)"><svg class="a12-mark" width="99.2" height="99.2" viewBox="26 26 56 56"><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div></div></div><figcaption class="a12-cap"><b>1 · Splash Android 12+ (opsi A, disarankan).</b> Latar polos <code>#F3F6FA</code>; ikon dengan latar (teal gradien) pada lingkaran 160dp dalam kanvas 240dp (<code>windowSplashScreenIconBackgroundColor</code>). Terang: bg <code>#F3F6FA</code>.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-immersive " style="--w:412px;--h:915px;" data-gestur="tidak"><div class="a12-splash"><div style="width:160px;height:160px;border-radius:50%;background:var(--grad-active);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn)"><svg class="a12-mark" width="99.2" height="99.2" viewBox="26 26 56 56"><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div></div></div><figcaption class="a12-cap"><b>2 · Mode gelap otomatis.</b> Splash mengikuti tema sistem (<code>values-night</code>): bg <code>#070B14</code>, ikon latar teal terang <code>#2DBFB1</code>→<code>#5B8CF6</code> tetap kontras. Tidak ada kilau putih saat cold start gelap.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-immersive " style="--w:412px;--h:915px;" data-gestur="tidak"><div class="a12-splash"><svg width="0" height="0"><defs><linearGradient id="rk-route" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#2F7BEA"/></linearGradient></defs></svg><svg class="a12-mark" width="119.03999999999999" height="119.03999999999999" viewBox="0 0 24 24" fill="none"><path d="M8.2 15.8 15.8 8.2" stroke="url(#rk-route)" stroke-width="2.6" stroke-linecap="round"/><circle cx="6.5" cy="17.5" r="3.2" fill="#14B8A6"/><circle cx="17.5" cy="6.5" r="3.2" fill="#2F7BEA"/></svg></div></div><figcaption class="a12-cap"><b>3 · Opsi B — ikon tanpa latar.</b> Rute berwarna di atas bg polos (kanvas 288dp, lingkaran 192dp). Lebih ringan tetapi lebih lemah di tema terang; tidak dipilih.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-immersive" style="--w:412px;--h:915px;" data-gestur="tidak"><div class="a12-splash"><div style="display:flex;flex-direction:column;align-items:center;gap:18px"><div class="a12-mark" style="width:120px;height:120px;border-radius:34%;overflow:hidden;position:relative;"><svg style="position:absolute;left:-30px;top:-30px;width:180px;height:180px" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">RuangKerja</div></div></div></div><figcaption class="a12-cap"><b>4 · Android ≤ 11 (<code>expo-splash-screen</code> klasik).</b> Ikon kotak bulat 120dp + nama di tengah, warna latar sama; setelah sesi tervalidasi langsung ke Beranda/Masuk (tanpa layar kedua).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-nosb" style="--w:412px;--h:915px;" data-gestur="tidak"><div class="a12-sheet" style="inset:20px 0 0 0"><h2 class="a12-ih">Dimensi splash Android 12</h2><p class="a12-ip">Ikon animasi (<code>windowSplashScreenAnimatedIcon</code>).</p><div style="position:relative;width:300px;height:300px;margin:18px auto 0"><svg width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="144" fill="none" stroke="var(--border-strong)" stroke-dasharray="4 4"/><circle cx="150" cy="150" r="96" fill="none" stroke="var(--warn)" stroke-width="1.5"/><circle cx="150" cy="150" r="80" fill="none" stroke="var(--primary)" stroke-width="1.5"/></svg><div style="position:absolute;left:70px;top:70px;width:160px;height:160px;display:flex;align-items:center;justify-content:center"><svg class="a12-mark" width="100" height="100" viewBox="26 26 56 56"><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div></div>
    <div class="a12-leg" style="padding:18px 4px 0"><div class="lg"><b style="background:var(--text-subtle);color:var(--surface)">288</b><div>Kanvas tanpa latar<em>logo muat lingkaran 192dp (garis kuning)</em></div></div><div class="lg"><b>240</b><div>Kanvas dengan latar ikon<em>logo muat lingkaran 160dp (garis teal) — dipakai opsi A</em></div></div><div class="lg"><b>≤1s</b><div>Animasi maks. 1000 ms<em>RuangKerja memakai ikon statis; transisi keluar memudar (180 ms, <code>ease-brand</code>)</em></div></div></div></div></div><figcaption class="a12-cap"><b>5 · Dimensi.</b> Sumber aset: <code>expo-splash-screen</code> plugin (<code>android.image</code>, <code>backgroundColor</code>, <code>dark.backgroundColor</code>, <code>imageWidth: 200</code>).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone" style="--w:412px;--h:915px;"><div class="body"><div class="skel" style="margin:20px 16px;height:90px"></div><div class="skel" style="margin:0 16px 16px;height:220px;border-radius:26px"></div><div class="skel" style="margin:0 16px 12px;height:60px"></div><div class="skel" style="margin:0 16px 12px;height:60px"></div></div></div><figcaption class="a12-cap"><b>6 · Setelah splash.</b> Langsung kerangka (skeleton) Beranda — bukan layar logo kedua; jika sesi belum divalidasi splash ditahan sampai <code>/auth/saya</code> selesai (maks. 3 dtk, lalu Beranda dari cache).</figcaption></figure>
