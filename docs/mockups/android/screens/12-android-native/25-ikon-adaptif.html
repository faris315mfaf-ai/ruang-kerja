    <circle cx="54" cy="54" r="36" fill="none" stroke="#fff" stroke-width=".5" stroke-dasharray="2 1.5"/><circle cx="54" cy="54" r="33" fill="none" stroke="#FFD28A" stroke-width=".6"/><rect x="0.3" y="0.3" width="107.4" height="107.4" fill="none" stroke="#fff" stroke-width=".6"/>
    <rect x="26" y="26" width="56" height="56" rx="14" fill="none" stroke="#7CF0E1" stroke-width=".5" stroke-dasharray="1.5 1"/></svg></div><div class="a12-leg" style="padding:16px 4px 0"><div class="lg"><b style="background:#FFD28A;color:#0B1A2B">66</b><div>Zona aman 66dp<em>Seluruh logo di dalam lingkaran ini</em></div></div><div class="lg"><b>72</b><div>Area terlihat 72dp<em>Sisanya (18dp tiap sisi) hanya untuk animasi parallax</em></div></div><div class="lg"><b>PNG</b><div>1024 × 1024 px, logo ≤ 676 px di tengah<em>Expo: <code>android.adaptiveIcon.foregroundImage / backgroundImage / monochromeImage</code></em></div></div></div></div></div><figcaption class="a12-cap"><b>1 · Konstruksi ikon adaptif 108dp.</b> Putih putus-putus = 72dp area terlihat (semua bentuk topeng); kuning = zona aman 66dp. Tile 56dp dengan rute di dalamnya muat di zona aman, jadi tidak terpotong bentuk apa pun.</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-nosb" style="--w:412px;--h:640px;" data-gestur="tidak"><div class="a12-sheet" style="inset:20px 0 0 0"><h2 class="a12-ih">Perbandingan</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="t-label">Saat ini</div><div style="width:140px;height:140px;border-radius:50%;overflow:hidden;position:relative;box-shadow:var(--shadow-card)"><svg style="position:absolute;left:-35px;top:-35px" width="210" height="210" viewBox="0 0 108 108"><rect width="108" height="108" fill="#0B7F86"/><line x1="36.7" y1="71.3" x2="71.3" y2="36.7" stroke="#0B7F86" stroke-width="6.3"/><circle cx="36.7" cy="71.3" r="5.9" fill="#14B8A6"/><circle cx="71.3" cy="36.7" r="5.9" fill="#2F7BEA"/></svg></div><div class="a12-sub" style="font-size:13px;line-height:18px">Garis rute berwarna sama dengan latar (teal di teal) sehingga hilang; hanya dua titik tampak.</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><div class="t-label">Diusulkan</div><div style="width:140px;height:140px;border-radius:50%;overflow:hidden;position:relative;box-shadow:var(--shadow-card)"><svg style="position:absolute;left:-35px;top:-35px" width="210" height="210" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div><div class="a12-sub" style="font-size:13px;line-height:18px">Tile putih 56dp + rute berwarna; kontras terjaga di semua topeng.</div></div></div>
   <div style="display:flex;gap:18px;align-items:center;justify-content:center;margin-top:20px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="a12-mark" style="width:96px;height:96px;border-radius:34%;overflow:hidden;position:relative;"><svg style="position:absolute;left:-24px;top:-24px;width:144px;height:144px" viewBox="0 0 108 108"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div><div class="a12-sub">Legacy / Play 512 px</div></div><div class="a12-sub" style="max-width:190px">Ikon Play Store dan ikon legacy (API &lt; 26) = latar + tile penuh 512×512 tanpa alfa; Play menerapkan sudutnya sendiri.</div></div></div></div><figcaption class="a12-cap"><b>2 · Ikon saat ini (<code>apps/mobile/assets/adaptive-icon.png</code>) vs usulan.</b> Temuan: garis rute memakai <code>#0B7F86</code> persis seperti <code>adaptiveIcon.backgroundColor</code>; dan <code>monochromeImage</code> belum ada (ikon bertema Android 13 jatuh ke ikon legacy).</figcaption></figure>
<figure class="a12-fig" style="--w:412px"><div class="phone a12-nosb" style="--w:412px;--h:500px;" data-gestur="tidak"><div class="a12-sheet" style="inset:20px 0 0 0"><h2 class="a12-ih">Lapis ikon</h2><p class="a12-ip">Masing-masing 108dp, ditampilkan pada kotak catur (transparan).</p><div class="a12-layers" style="margin-top:16px"><div><div class="a12-checker" style="width:112px;height:112px;overflow:hidden"><svg width="112" height="112" viewBox="0 0 108 108" style="display:block;"><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#0B7F86" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#14B8A6"/><circle cx="67" cy="41" r="5.5" fill="#2F7BEA"/></svg></div>Latar depan</div><div><div class="a12-checker" style="width:112px;height:112px;overflow:hidden"><svg width="112" height="112" viewBox="0 0 108 108" style="display:block;"><defs><linearGradient id="a12g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B7F86"/><stop offset="1" stop-color="#1E5FD6"/></linearGradient></defs><rect width="108" height="108" fill="url(#a12g)"/></svg></div>Latar belakang</div><div><div class="a12-checker" style="width:112px;height:112px;overflow:hidden;color:var(--text)"><svg width="112" height="112" viewBox="0 0 108 108" style="display:block;"><mask id="a12m"><rect width="108" height="108" fill="#000"/><rect x="26" y="26" width="56" height="56" rx="14" fill="#fff"/><line x1="42" y1="66" x2="66" y2="42" stroke="#000" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="67" r="5.5" fill="#000"/><circle cx="67" cy="41" r="5.5" fill="#000"/></mask><rect width="108" height="108" fill="currentColor" mask="url(#a12m)"/></svg></div>Monokrom</div></div><div class="a12-sub" style="margin-top:22px;font-size:14px;line-height:20px"><b>Berkas:</b> <code>icon.png</code> (1024, tanpa alfa, untuk Play/legacy) · <code>adaptive-foreground.png</code> · <code>adaptive-background.png</code> (atau warna/gradien) · <code>adaptive-monochrome.png</code> (hitam di transparan).</div></div></div><figcaption class="a12-cap"><b>3 · Tiga lapis.</b> Latar depan transparan di luar tile; monokrom = siluet tile dengan rute dilubangi (Android mewarnai dengan warna dinamis, bagian lubang menampilkan latar tema). Gradien di latar belakang boleh vektor atau PNG.</figcaption></figure>

/div><figcaption class="a12-cap"><b>4 · Bentuk topeng & ukuran.</b> Rute dan tile tetap terbaca pada 48dp (ikon bilah tugas) dan di setiap bentuk; titik terkecil (r 5,5dp) masih ≥ 2 px di mdpi.</figcaption></figure>
