<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Direktur Utama · portofolio · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#0B1A2B;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; flex-direction: column"><span style="font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -0.025em">Portofolio</span><span style="font-size: 14px; color: #46576B">6 proyek · tarik ke bawah untuk menyegarkan</span></span>
    <div role="tablist" aria-label="Saring" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE4EC">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 42px; border: 0; border-radius: 12px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
    <sc-for list="{{cards}}" as="p" hint-placeholder-count="6">
      <a href="{{p.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDE4EC">
        <span style="width: 56px; height: 56px; border-radius: 28px; background: conic-gradient({{p.ring}} 0 {{p.pct}}%, #EEF2F7 {{p.pct}}% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.pct}}%</span></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span><span style="font-size: 13px; color: #46576B">{{p.next}}</span><span style="font-size: 13px; font-weight: 800; color: {{p.sFg}}">{{p.status}}</span></span>
      </a>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" active="beranda" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ST = { ok: ['Sesuai jalur · rencana ', '#0F7A55', '#14B8A6'], warn: ['Berisiko · rencana ', '#9A5800', '#E08A00'], late: ['Bermasalah · rencana ', '#C42137', '#C42137'] };
var P = [['DEP', 'Dashboard Eksekutif Pemda', 30, 50, 'late', 'API Pemda terlewat 2 Okt', 'PDirutKeputusan.dc.html'], ['KMB', 'Aplikasi Koperasi Maju', 45, 52, 'warn', 'Sprint 6 review · Jum, 9 Okt', 'MgPProyek.dc.html'], ['SIM', 'SIMRS RS Harapan Sehat', 72, 70, 'ok', 'Go-live · Sen, 19 Okt', 'MgPProyek.dc.html'], ['RKJ', 'RuangKerja internal', 88, 80, 'ok', 'Rilis Fase 1 · Sen, 26 Okt', 'MgPProyek.dc.html'], ['WEB', 'Rebranding & website SPKD', 60, 65, 'ok', 'Logo final · Rab, 7 Okt', 'MgPProyek.dc.html'], ['PSL', 'Portal Logistik Sinar', 20, 18, 'ok', 'Kontrak · Kam, 8 Okt', 'MgPProyek.dc.html']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 0 };
  }
  renderVals() {
    var self = this;
    var f = (this.state && this.state.f) || 0;
    return {
      tabs: ['Semua (6)', 'Perlu perhatian (2)'].map(function (l, i) { var on = i === f; return { label: l, sel: on ? 'true' : 'false', bg: on ? 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)' : 'transparent', fg: on ? '#FFFFFF' : '#46576B', pick: function () { self.setState({ f: i }); } }; }),
      cards: P.filter(function (p) { return f === 0 || p[4] !== 'ok'; }).map(function (p) { var s = ST[p[4]]; return { name: p[1], pct: p[2], status: s[0] + p[3] + '%', sFg: s[1], ring: s[2], next: p[5], href: p[6] }; })
    };
  }
}
</script>
</body>
</html>
