<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Branding & Marketing · review materi · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="PeranMMarketing.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DDE4EC; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 20px; line-height: 26px; font-weight: 800">Brosur tender Kominfo</span><span style="font-size: 13px; color: #46576B">versi 3 · tenggat Jum, 9 Okt</span></span>
    </div>
    <div style="position: relative; height: 300px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDE4EC; overflow: hidden">
      <div style="height: 120px; background: linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); padding: 18px; box-sizing: border-box; color: #FFFFFF; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px"><span style="font-size: 12px; font-weight: 800; opacity: 0.85">SPKD · PROFIL PERUSAHAAN</span><span style="font-size: 20px; font-weight: 800; line-height: 24px">Solusi digital untuk layanan publik</span></div>
      <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 8px"><span style="height: 8px; width: 70%; border-radius: 4px; background: #0B1A2B"></span><span style="height: 6px; border-radius: 3px; background: #DDE4EC"></span><span style="height: 6px; border-radius: 3px; background: #DDE4EC"></span><span style="height: 6px; width: 85%; border-radius: 3px; background: #DDE4EC"></span><span style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding-top: 8px"><span style="height: 54px; border-radius: 10px; background: #E8FBF8"></span><span style="height: 54px; border-radius: 10px; background: #E6EEFE"></span><span style="height: 54px; border-radius: 10px; background: #FFF1DC"></span></span></div>
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="3">
        <button type="button" onClick="{{p.pick}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 30px; height: 30px; border-radius: 15px 15px 15px 4px; border: 2px solid #FFFFFF; background: {{p.bg}}; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(11,26,43,0.25)">{{p.n}}</button>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="display: flex; justify-content: space-between"><span style="font-size: 14px; font-weight: 800; color: #BE185D">Komentar {{c.n}} dari 3</span><span style="font-size: 13px; color: #46576B">{{c.who}}</span></span>
      <span style="font-size: 16px; line-height: 23px; font-weight: 600">{{c.t}}</span>
      <button type="button" onClick="{{resolve}}" style="align-self: flex-start; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3CEDA; background: {{c.rBg}}; color: {{c.rFg}}; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{c.rLabel}}</button>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #DDE4EC">
    <button type="button" style="height: 56px; border-radius: 16px; border: 1px solid #C3CEDA; background: #FFFFFF; color: #0B1A2B; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Minta revisi</button>
    <button type="button" onClick="{{approve}}" style="height: 56px; border: 0; border-radius: 16px; background: {{btnBg}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">{{btn}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var C = [['Ganti judul jadi “Mitra digital layanan publik”, sesuai bahasa tender.', 'Hendra Wijaya · Dirut', 236, 40], ['Angka 48.000 rekam medis perlu izin RS sebelum dicantumkan.', 'Nadia Putri · Sekretariat', 40, 170], ['Tambahkan sertifikat ISO 27001 yang sedang berjalan? Sebaiknya jangan dulu.', 'Agus Setiawan · Direktur', 300, 230]];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { c: 0, res: {}, ok: false };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var ci = st.c || 0;
    var res = st.res || {};
    var open = C.filter(function (c, i) { return !res[i]; }).length;
    return {
      pins: C.map(function (c, i) { var on = i === ci; return { n: i + 1, x: c[2], y: c[3], aria: 'Komentar ' + (i + 1), bg: res[i] ? '#0F7A55' : (on ? '#BE185D' : '#46576B'), pick: function () { self.setState({ c: i }); } }; }),
      c: { n: ci + 1, t: C[ci][0], who: C[ci][1], rLabel: res[ci] ? 'Selesai ✓' : 'Tandai selesai', rBg: res[ci] ? '#E3F6EE' : '#FFFFFF', rFg: res[ci] ? '#0F7A55' : '#0B1A2B' },
      resolve: function () { var n = Object.assign({}, res); n[ci] = !res[ci]; self.setState({ res: n }); },
      btn: st.ok ? 'Disetujui ✓' : (open ? 'Setujui (' + open + ' terbuka)' : 'Setujui & kirim'),
      btnBg: st.ok ? 'linear-gradient(135deg, #14B8A6 0%, #0F7A55 100%)' : 'linear-gradient(135deg, #C2410C 0%, #BE185D 100%)',
      approve: function () { self.setState({ ok: true }); }
    };
  }
}
</script>
</body>
</html>
