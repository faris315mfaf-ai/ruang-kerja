<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Beranda per peran SPKD · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 800; color: #09656E">SPKD · {{r.unit}}</span>
        <span style="font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em">{{r.greet}}</span>
      </span>
      <span style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #14B8A6 0%, #2F7BEA 100%); color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.initials}}</span>
    </div>

    <div style="border-radius: 24px; padding: 18px; color: #FFFFFF; display: flex; flex-direction: column; gap: 6px; background: radial-gradient(220px 160px at 100% 0%, rgba(255,255,255,0.22), transparent 70%), linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); box-shadow: 0 14px 30px rgba(30,95,214,0.30)">
      <span style="font-size: 15px; font-weight: 700">{{r.hero.label}}</span>
      <span style="font-size: 40px; line-height: 46px; font-weight: 800; letter-spacing: -0.02em">{{r.hero.value}}</span>
      <span style="font-size: 15px; line-height: 21px">{{r.hero.note}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{r.tiles}}" as="t" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600; color: #46576B">{{t.label}}</span>
          <span style="font-size: 28px; line-height: 34px; font-weight: 800; color: {{t.color}}">{{t.value}}</span>
          <span style="font-size: 13px; color: #46576B">{{t.note}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <sc-for list="{{r.flows}}" as="f" hint-placeholder-count="2">
        <a href="{{f.href}}" style="height: 48px; border-radius: 14px; background: {{f.bg}}; color: {{f.fg}}; border: {{f.border}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; text-align: center; line-height: 18px">{{f.label}}</a>
      </sc-for>
    </div>
    <a href="MRapat.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDE4EC; color: #0B1A2B">
      <span style="width: 52px; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">{{r.next.time}}</span><span style="font-size: 12px; font-weight: 700; color: #46576B">{{r.next.day}}</span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">{{r.next.title}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #46576B"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{r.next.pBg}}; color: {{r.next.pFg}}; font-weight: 800; display: inline-flex; align-items: center">{{r.next.place}}</span>jadwal terdekat</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8495A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 14px 16px 2px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px"><span style="font-size: 17px; font-weight: 800">{{r.listTitle}}</span><a href="#" style="font-size: 15px; font-weight: 700">Semua</a></div>
      <sc-for list="{{r.rows}}" as="x" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; border-top: 1px solid #EEF2F7">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: {{x.iconBg}}; color: {{x.iconFg}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{x.tag}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.title}}</span><span style="font-size: 13px; color: #46576B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.meta}}</span></span>
          <span style="height: 26px; padding: 0 9px; border-radius: 13px; background: {{x.bBg}}; color: {{x.bFg}}; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap">{{x.badge}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" active="beranda" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    var s = R[(this.props && this.props.role) || 'dirut'] || R.dirut;
    var p = PL[s.next[3]];
    return {
      r: {
        flows: s.flows.map(function (f, i) { return { label: f[0], href: f[1], bg: i ? '#FFFFFF' : '#0B1A2B', fg: i ? '#0B1A2B' : '#FFFFFF', border: i ? '1px solid #C3CEDA' : '0' }; }),

}
