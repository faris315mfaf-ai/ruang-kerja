<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rapat · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em">Rapat</h1>
      <button type="button" aria-label="Jadwalkan rapat" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Hari" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{d.sel}}" onClick="{{d.pick}}" style="height: 64px; border-radius: 16px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 13px; font-weight: 700">{{d.dow}}</span><span style="font-size: 21px; font-weight: 800">{{d.n}}</span></button>
      </sc-for>
    </div>
    <a href="MRapatDetail.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 24px; color: #FFFFFF; background: radial-gradient(220px 160px at 100% 0%, rgba(255,255,255,0.22), transparent 70%), linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); box-shadow: 0 14px 30px rgba(30,95,214,0.30)">
      <span style="align-self: flex-start; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.2); font-size: 13px; font-weight: 800; display: inline-flex; align-items: center">MULAI 5 MENIT LAGI</span>
      <span style="font-size: 21px; line-height: 27px; font-weight: 800">Koordinasi peluncuran Q4</span>
      <span style="font-size: 15px">10.30–11.30 · Google Meet · 6 peserta</span>
      <span style="height: 50px; border-radius: 14px; background: #FFFFFF; color: #0A4E57; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">Gabung</span>
    </a>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; overflow: hidden">
      <sc-for list="{{list}}" as="m" hint-placeholder-count="3">
        <a href="{{m.href}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: {{m.sep}}; color: #0B1A2B">
          <span style="width: 54px; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">{{m.start}}</span><span style="font-size: 13px; color: #46576B">{{m.end}}</span></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700; color: {{m.color}}">{{m.title}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{m.pBg}}; color: {{m.pFg}}; font-weight: 800; display: inline-flex; align-items: center">{{m.platform}}</span><span style="color: #46576B; font-weight: 600">{{m.note}}</span></span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8495A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" active="menu" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var PF = { 'Meet': ['#E8FBF8', '#09656E'], 'Zoom': ['#E6EEFE', '#1A4CB0'], 'Ruang': ['#EEF2F7', '#46576B'] };
var D = [
  ['Sen', '5', [['09.00', '09.30', 'Stand-up Divisi Operasional', 'Meet', 'Notulen final', 'MNotulen.dc.html', '#46576B'], ['13.30', '14.30', 'Review vendor logistik', 'Zoom', 'Anda diundang', '#', '#0B1A2B'], ['15.00', '15.30', 'Sinkronisasi migrasi gudang', 'Meet', 'Anda penyelenggara', '#', '#0B1A2B']]],
  ['Sel', '6', [['10.00', '11.00', 'Evaluasi renovasi lantai 2', 'Ruang', 'Lt. 3', '#', '#0B1A2B']]],
  ['Rab', '7', [['09.00', '09.30', 'Stand-up Divisi Operasional', 'Meet', 'berulang', '#', '#0B1A2B']]],
  ['Kam', '8', [['13.00', '14.00', 'Presentasi materi ke Direksi', 'Meet', 'PLQ', '#', '#0B1A2B']]],
  ['Jum', '9', [['09.00', '09.30', 'Stand-up Divisi Operasional', 'Meet', 'berulang', '#', '#0B1A2B'], ['16.00', '16.45', 'Retro mingguan', 'Ruang', 'Lt. 2', '#', '#0B1A2B']]]
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: 0 };
  }
  renderVals() {
    var self = this;
    var di = (this.state && this.state.d) || 0;
    return {
      days: D.map(function (d, i) { var on = i === di; return { dow: d[0], n: d[1], sel: on ? 'true' : 'false', bg: on ? 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0B1A2B', border: on ? '0' : '1px solid #DDE4EC', pick: function () { self.setState({ d: i }); } }; }),
      list: D[di][2].map(function (m, i) { var p = PF[m[3]]; return { start: m[0], end: m[1], title: m[2], platform: m[3], note: m[4], href: m[5], color: m[6], pBg: p[0], pFg: p[1], sep: i ? '1px solid #EEF2F7' : '0' }; })
    };
  }
}
</script>
</body>
</html>
