<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Detail tugas staf · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="MSBeranda.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DDE4EC; color: #0B1A2B; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DDE4EC">MSG-23</span>
      <span style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 16px; background: #FFF1DC; color: #9A5800; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Hari ini</span>
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 35px; font-weight: 800; letter-spacing: -0.02em">Uji impor data stok batch 2</h1>
    <div role="radiogroup" aria-label="Status" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #E4EAF1">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{s.aria}}" onClick="{{s.pick}}" style="height: 44px; border: 0; border-radius: 12px; background: {{s.bg}}; color: {{s.color}}; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: {{s.shadow}}">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 14px 16px 6px; display: flex; flex-direction: column">
      <span style="display: flex; justify-content: space-between; font-size: 16px; padding-bottom: 6px"><b>Checklist</b><b style="color: #09656E">{{doneN}}/5</b></span>
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
        <button type="button" role="checkbox" aria-checked="{{c.aria}}" onClick="{{c.toggle}}" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; border: 0; border-top: 1px solid #EEF2F7; background: transparent; font: inherit; text-align: left; cursor: pointer; color: #0B1A2B">
          <span style="width: 26px; height: 26px; border-radius: 8px; box-sizing: border-box; border: {{c.border}}; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.tick}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></span>
          <span style="font-size: 17px; color: {{c.color}}; text-decoration: {{c.deco}}">{{c.label}}</span>
        </button>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; min-height: 48px; align-items: center; font-size: 16px; border-bottom: 1px solid #EEF2F7"><span style="color: #46576B">Reviewer</span><b>Dimas Pratama</b></div>
      <div style="display: flex; justify-content: space-between; min-height: 48px; align-items: center; font-size: 16px; border-bottom: 1px solid #EEF2F7"><span style="color: #46576B">Milestone</span><b style="color: #09656E">Uji coba · 16 Okt</b></div>
      <a href="#" style="display: flex; justify-content: space-between; min-height: 48px; align-items: center; font-size: 16px; color: #0B1A2B"><span style="color: #46576B">Komentar &amp; lampiran</span><b>3 · 2</b></a>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; display: flex; gap: 10px; background: rgba(255,255,255,0.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #DDE4EC">
    <button type="button" aria-label="Tulis komentar" style="width: 56px; height: 56px; border: 1px solid #C3CEDA; border-radius: 16px; background: #FFFFFF; color: #0B1A2B; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg></button>
    <button type="button" onClick="{{cta.go}}" style="flex: 1; height: 56px; border: 0; border-radius: 16px; background: {{cta.bg}}; color: {{cta.fg}}; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: {{cta.shadow}}">{{cta.label}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var S = ['Todo', 'Dikerjakan', 'Review', 'Selesai'];
var C = ['Ekspor data dari sistem lama', 'Bersihkan 12 SKU ganda', 'Impor ke sistem baru', 'Cocokkan jumlah per rak', 'Catat selisih di sheet'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { s: 'Dikerjakan', done: { 0: true, 1: true, 2: true } };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var s = st.s || 'Dikerjakan';
    var done = st.done || {};
    var review = s === 'Review' || s === 'Selesai';
    return {
      steps: S.map(function (l) { var on = l === s; return { label: l, aria: on ? 'true' : 'false', bg: on ? 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)' : 'transparent', color: on ? '#FFFFFF' : '#46576B', shadow: on ? '0 6px 16px rgba(30,95,214,0.30)' : 'none', pick: function () { self.setState({ s: l }); } }; }),
      doneN: C.filter(function (c, i) { return done[i]; }).length,
      checks: C.map(function (l, i) { var on = !!done[i]; return { label: l, aria: on ? 'true' : 'false', bg: on ? 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)' : '#FFFFFF', border: on ? '0' : '2px solid #C3CEDA', tick: on ? '#FFFFFF' : 'transparent', color: on ? '#46576B' : '#0B1A2B', deco: on ? 'line-through' : 'none', toggle: function () { var d = Object.assign({}, done); d[i] = !on; self.setState({ done: d }); } }; }),
      cta: review ? { label: 'Menunggu review Dimas', bg: '#E6EEFE', fg: '#1A4CB0', shadow: 'none', go: function () { self.setState({ s: 'Dikerjakan' }); } }
                  : { label: 'Kirim ke review', bg: 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', fg: '#FFFFFF', shadow: '0 10px 24px rgba(30,95,214,0.34)', go: function () { self.setState({ s: 'Review' }); } }
    };
  }
}
</script>
</body>
</html>
