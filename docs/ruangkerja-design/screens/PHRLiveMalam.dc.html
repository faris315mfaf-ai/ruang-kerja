<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>HR · kehadiran langsung · ponsel · mode malam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#5AD6C8;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #EAF1F8; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: #070B14">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="PeranMHRMalam.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #0F1622; border: 1px solid #233247; color: #EAF1F8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 24px; line-height: 30px; font-weight: 800">Kehadiran langsung</span><span style="font-size: 13px; font-weight: 700; color: #4ADE9B">● diperbarui 09.40</span></span>
    </div>
    <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px"><span style="flex: 41; background: linear-gradient(90deg, #14B8A6 0%, #2F7BEA 100%)"></span><span style="flex: 3; background: #E08A00"></span><span style="flex: 2; background: #6D4AE0"></span><span style="flex: 2; background: #34465E"></span></div>
    <div role="tablist" aria-label="Status" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="background: #0F1622; border: 1px solid #233247; border-radius: 22px; overflow: hidden">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; border-top: {{p.sep}}">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: #14223F; color: #A9C2FF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{p.n}}</span><span style="font-size: 13px; color: #A6B4C6">{{p.m}}</span></span>
          <sc-if value="{{p.remind}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{p.ping}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: {{p.bBorder}}; background: {{p.bBg}}; color: {{p.bFg}}; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap">{{p.bLabel}}</button></sc-if>
          <sc-if value="{{p.badge}}" hint-placeholder-val="{{true}}"><span style="height: 26px; padding: 0 9px; border-radius: 13px; background: {{p.sBg}}; color: {{p.sFg}}; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap">{{p.s}}</span></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" malam="{{ true }}" dark="{{ true }}" active="absen" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ST = { none: ['Belum check-in', '#3A1520', '#FF7A8A'], late: ['Terlambat', '#2E2210', '#F6B95C'], dl: ['Luar radius', '#14223F', '#A9C2FF'], cuti: ['Cuti/izin', '#241B45', '#B8A6FF'], ok: ['Tepat waktu', '#0E2A20', '#4ADE9B'] };
var P = [['Arif Nugroho', 'Programming · tanpa pengajuan', 'none'], ['Tika Maharani', 'Sekretariat · tanpa pengajuan', 'none'], ['Yoga Permana', 'Programming · 08.12 · 12 menit', 'late'], ['Dewi Anggraini', 'Analis · 08.09 · 9 menit', 'late'], ['Reza Mahendra', 'Branding · 08.14 · ke-3 minggu ini', 'late'], ['Bayu Saputra', 'RS Harapan Sehat · dinas luar disetujui', 'dl'], ['Lina Marlina', 'RS Harapan Sehat · dinas luar disetujui', 'dl'], ['Sinta Larasati', 'Branding · cuti tahunan 5–6 Okt', 'cuti'], ['Gilang Ramadhan', 'Implementer · izin keperluan keluarga', 'cuti'], ['Hana Nuraini', 'HR · 07.38', 'ok']];
var CH = [['perlu', 'Perlu tindakan 7'], ['none', 'Belum 2'], ['late', 'Terlambat 3'], ['dl', 'Luar radius 2'], ['cuti', 'Cuti/izin 2']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'perlu', pinged: {} };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var f = st.f || 'perlu';
    var pg = st.pinged || {};
    var list = P.filter(function (p) { return f === 'perlu' ? (p[2] === 'none' || p[2] === 'late' || p[2] === 'dl') : p[2] === f; });
    return {
      chips: CH.map(function (c) { var on = c[0] === f; return { label: c[1], sel: on ? 'true' : 'false', bg: on ? '#3B4F6B' : '#0F1622', fg: on ? '#FFFFFF' : '#EAF1F8', border: on ? '0' : '1px solid #233247', pick: function () { self.setState({ f: c[0] }); } }; }),
      people: list.map(function (p, i) {
        var s = ST[p[2]]; var parts = p[0].split(' '); var done = !!pg[p[0]];
        return { n: p[0], m: p[1], ini: parts[0][0] + parts[1][0], s: s[0], sBg: s[1], sFg: s[2], sep: i ? '1px solid #172131' : '0',
          remind: p[2] === 'none', badge: p[2] !== 'none',
          bLabel: done ? 'Terkirim ✓' : 'Ingatkan', bBg: done ? '#0E2A20' : 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', bFg: done ? '#4ADE9B' : '#FFFFFF', bBorder: '0',
          ping: function () { var n = Object.assign({}, pg); n[p[0]] = true; self.setState({ pinged: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
