<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Aksi cepat · ponsel · mode malam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#EAF1F8;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #EAF1F8; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #070B14">
  <div aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 180px; height: 34px; border-radius: 10px; background: #233247"></div>
    <div style="height: 150px; border-radius: 24px; background: linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)"></div>
    <div style="height: 90px; border-radius: 20px; background: #0F1622"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.63)"></div>
  <div role="dialog" aria-label="Aksi cepat" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #0F1622; padding: 12px 18px 30px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -16px 40px rgba(0,0,0,0.5)">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #34465E"></span>
    <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 22px; font-weight: 800">Buat cepat</span><span style="font-size: 14px; color: #A6B4C6">sapu ke bawah untuk menutup</span></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="6">
        <button type="button" onClick="{{a.pick}}" style="height: 104px; border-radius: 18px; border: {{a.border}}; background: {{a.bg}}; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #EAF1F8; padding: 0 6px">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: {{a.grad}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg></span>
          <span style="font-size: 14px; font-weight: 800; line-height: 18px; text-align: center">{{a.label}}</span>
        </button>
      </sc-for>
    </div>
    <button type="button" onClick="{{rec}}" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-radius: 18px; border: 1px solid #233247; background: {{recBg}}; font: inherit; cursor: pointer; color: #EAF1F8; text-align: left">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #C42137; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v3"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">{{recLabel}}</span><span style="font-size: 13px; color: #A6B4C6">diubah jadi teks, lalu pilih: tugas, notulen, atau catatan</span></span>
    </button>
    <span style="font-size: 14px; color: #A6B4C6; text-align: center">{{hint}}</span>
  </div>
  <span aria-hidden="true" style="position: absolute; right: 22px; bottom: 470px; width: 56px; height: 56px; border-radius: 28px; background: #3B4F6B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0,0,0,0.6)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var T = 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', I = 'linear-gradient(135deg, #2F7BEA 0%, #6D4AE0 100%)', W = 'linear-gradient(135deg, #C2410C 0%, #BE185D 100%)';
var A = [
  ['Tugas baru', 'M12 5v14M5 12h14', T, 'Form tugas terbuka dengan proyek terakhir: KMB'],
  ['Catat notulen', 'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5', I, 'Notulen terhubung ke rapat yang sedang berlangsung'],
  ['Jadwalkan rapat', 'M8 3v4M16 3v4M4 9h16M5 5h14v15H5z', T, 'Tautan Google Meet dibuat otomatis'],
  ['Ajukan cuti', 'M3 12h18M12 3v18', I, 'Saldo cuti Anda 7 hari'],
  ['Lapor kendala', 'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', W, 'Kendala dikirim ke atasan dan PIC proyek'],
  ['Pindai dokumen', 'M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M7 12h10', T, 'Kamera terbuka, hasil disimpan sebagai PDF']
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: -1, rec: false };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var sel = typeof st.sel === 'number' ? st.sel : -1;
    return {
      actions: A.map(function (a, i) { var on = i === sel; return { label: a[0], icon: a[1], grad: a[2], bg: on ? '#13203A' : '#070B14', border: on ? '2px solid #5B8CF6' : '1px solid transparent', pick: function () { self.setState({ sel: i }); } }; }),
      hint: sel >= 0 ? A[sel][3] : 'Tekan lama tombol + di beranda untuk langsung membuka tugas baru',
      recLabel: st.rec ? 'Merekam… 0:07 · ketuk untuk berhenti' : 'Rekam catatan suara',
      recBg: st.rec ? '#3A1520' : '#0F1622',
      rec: function () { self.setState({ rec: !st.rec }); }
    };
  }
}
</script>
</body>
</html>
