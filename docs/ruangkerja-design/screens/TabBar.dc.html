<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tab bar ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 110px; pointer-events: none; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <nav aria-label="Navigasi utama" style="pointer-events: auto; position: absolute; left: 12px; right: 12px; bottom: 14px; height: 70px; padding: 6px; box-sizing: border-box; display: flex; gap: 2px; border-radius: 35px; background: {{t.bg}}; backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" aria-current="{{tab.current}}" onClick="{{tab.pick}}" style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 29px; text-decoration: none; background: {{tab.bg}}; color: {{tab.color}}; box-shadow: {{tab.shadow}}; transition: background .18s cubic-bezier(.2,.8,.2,1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d1}}"></path><path d="{{tab.d2}}"></path></svg>
        <span style="font-size: 12px; line-height: 16px; font-weight: 700">{{tab.label}}</span>
        <sc-if value="{{tab.hasBadge}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #C42137; color: #FFFFFF; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center">{{tab.badge}}</span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["beranda","absen","tugas","inbox","menu","ringkasan","kerja","absensi","proyek","jadwal"],"default":"beranda"},"set":{"editor":"enum","options":["umum","manajemen"],"default":"umum"},"dark":{"editor":"boolean","default":false},"malam":{"editor":"boolean","default":false},"$preview":{"width":390,"height":110}}'>
var TABS = [
  ['beranda', 'Beranda', 'MBeranda.dc.html', ['M3 10.5 12 3l9 7.5', 'M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5']],
  ['absen', 'Absen', 'MAbsen.dc.html', ['M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z', 'M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z']],
  ['tugas', 'Tugas', 'MTugas.dc.html', ['m9 11 3 3 8-8', 'M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11']],
  ['inbox', 'Inbox', 'MInbox.dc.html', ['M22 12h-6l-2 3h-4l-2-3H2', 'M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z']],
  ['menu', 'Menu', 'MMenu.dc.html', ['M4 6h16', 'M4 12h16M4 18h16']]
];
var MGMT = [
  ['ringkasan', 'Ringkasan', 'MgPDashboard.dc.html', ['M3 10.5 12 3l9 7.5', 'M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5']],
  ['kerja', 'Kerja', 'MgPKerja.dc.html', ['M4 20V10M10 20V4M16 20v-7', 'M22 20H2']],
  ['absensi', 'Absensi', 'MgPAbsensi.dc.html', ['M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z', 'M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z']],
  ['proyek', 'Proyek', 'MgPProyek.dc.html', ['M5 21V4', 'M5 4h11l-2 4 2 4H5']],
  ['jadwal', 'Jadwal', 'MgPJadwal.dc.html', ['M8 3v4M16 3v4M4 9h16', 'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z']]
];
var LIGHT = { bg: 'rgba(255,255,255,0.72)', border: 'rgba(255,255,255,0.85)', shadow: '0 0 0 1px rgba(11,26,43,0.08), 0 14px 36px rgba(11,26,43,0.18)', idle: '#46576B', active: 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', activeText: '#FFFFFF', glow: '0 6px 16px rgba(30,95,214,0.35)' };
var DARK = { bg: 'rgba(23,33,49,0.72)', border: 'rgba(255,255,255,0.10)', shadow: '0 0 0 1px rgba(0,0,0,0.5), 0 14px 36px rgba(0,0,0,0.5)', idle: '#A6B4C6', active: 'linear-gradient(135deg, #2DBFB1 0%, #5B8CF6 100%)', activeText: '#041421', glow: '0 6px 16px rgba(91,140,246,0.35)' };
function nm(h, on) { return on && /\.dc\.html$/.test(h) && h !== 'DBoard.dc.html' ? h.replace('.dc.html', 'Malam.dc.html') : h; }
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    var self = this;
    var p = this.props || {};
    var t = p.dark ? DARK : LIGHT;
    var active = (this.state && this.state.picked) || p.active || 'beranda';
    return {
      t: t,
      tabs: (p.set === 'manajemen' ? MGMT : TABS).map(function (x) {
        var on = x[0] === active;
        return {
          label: x[1], href: nm(x[2], p.malam), d1: x[3][0], d2: x[3][1],
          current: on ? 'page' : undefined,
          bg: on ? t.active : 'transparent', color: on ? t.activeText : t.idle, shadow: on ? t.glow : 'none',
          hasBadge: (x[0] === 'inbox' || x[0] === 'jadwal') && !on, badge: x[0] === 'jadwal' ? '2' : '4',
          pick: function () { self.setState({ picked: x[0] }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
