<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tracking absensi · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; flex-direction: column"><span style="font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -0.025em">Absensi</span><span style="font-size: 14px; color: #46576B">Sen, 5 Okt · jam masuk 08.00 · per 09.40</span></span>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 38px; line-height: 44px; font-weight: 800">44<span style="font-size: 22px; color: #8495A8">/48 hadir</span></span><span style="font-size: 20px; font-weight: 800; color: #0F7A55">92%</span></span>
      <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px"><span style="flex: 41; background: linear-gradient(90deg, #14B8A6 0%, #2F7BEA 100%)"></span><span style="flex: 3; background: #E08A00"></span><span style="flex: 2; background: #6D4AE0"></span><span style="flex: 2; background: #C3CEDA"></span></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 5px; background: #14B8A6"></span>Tepat waktu <b style="margin-left: auto">41</b></span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 5px; background: #E08A00"></span>Terlambat <b style="margin-left: auto">3</b></span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 5px; background: #6D4AE0"></span>Cuti / izin <b style="margin-left: auto">2</b></span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 5px; background: #C3CEDA"></span>Belum <b style="margin-left: auto">2</b></span>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 12px 16px 2px">
      <span style="display: block; font-size: 17px; font-weight: 800; padding-bottom: 4px">Per divisi</span>
      <sc-for list="{{divs}}" as="d" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 1fr 90px 44px; gap: 10px; align-items: center; min-height: 40px; border-top: 1px solid #EEF2F7">
          <span style="font-size: 15px; font-weight: 600">{{d.name}}</span>
          <span style="position: relative; display: block; height: 6px; border-radius: 3px; background: #EEF2F7"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{d.pct}}%; border-radius: 3px; background: {{d.fill}}"></span></span>
          <b style="font-size: 15px; text-align: right">{{d.v}}</b>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 12px 16px 2px">
      <span style="display: block; font-size: 17px; font-weight: 800; padding-bottom: 4px">Perlu ditindaklanjuti</span>
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 54px; border-top: 1px solid #EEF2F7">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><span style="font-size: 13px; color: #46576B">{{a.meta}}</span></span>
          <span style="height: 26px; padding: 0 9px; border-radius: 13px; background: {{a.sBg}}; color: {{a.sFg}}; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap">{{a.status}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" set="manajemen" active="absensi" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DV = [['Programming', 13, 14], ['Implementer', 8, 9], ['Analis', 6, 6], ['Branding & Marketing', 5, 6], ['Sekretariat & HR', 12, 13]];
var AL = [['Arif Nugroho', 'Programming · pengingat 08.15', 'Belum check-in', '#FDE7EA', '#C42137'], ['Tika Maharani', 'Sekretariat · tidak bisa dihubungi', 'Belum check-in', '#FDE7EA', '#C42137'], ['Reza Mahendra', 'Branding · 08.14 · ke-3 minggu ini', 'Terlambat', '#FFF1DC', '#9A5800']];
class Component extends DCLogic {
  renderVals() {
    return {
      divs: DV.map(function (d) { var pct = Math.round(d[1] / d[2] * 100); return { name: d[0], v: d[1] + '/' + d[2], pct: pct, fill: pct >= 90 ? 'linear-gradient(90deg, #14B8A6 0%, #2F7BEA 100%)' : '#E08A00' }; }),
      alerts: AL.map(function (a) { return { name: a[0], meta: a[1], status: a[2], sBg: a[3], sFg: a[4] }; })
    };
  }
}
</script>
</body>
</html>
