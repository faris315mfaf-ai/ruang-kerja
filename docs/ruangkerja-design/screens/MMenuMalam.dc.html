<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu · ponsel · mode malam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#5AD6C8;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #EAF1F8; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #070B14">
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em">Menu</h1>
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; color: #FFFFFF; background: radial-gradient(220px 160px at 100% 0%, rgba(255,255,255,0.22), transparent 70%), linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); box-shadow: 0 14px 30px rgba(30,95,214,0.30)">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: rgba(255,255,255,0.2); border: 2px solid rgba(15,22,34,0.5); font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">SW</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 800">Sari Wulandari</span><span style="font-size: 15px">Staf Data · Divisi Operasional</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A6B4C6; padding: 4px 4px 0">Workspace</span>
    <div style="background: #0F1622; border: 1px solid #233247; border-radius: 22px; overflow: hidden">
      <sc-for list="{{ws}}" as="w" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 60px; border-top: {{w.sep}}; color: #EAF1F8">
          <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 11px; background: {{w.grad}}; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{w.l}}</span>
          <span style="flex: 1; font-size: 17px; font-weight: 600">{{w.name}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7D8FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>

    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A6B4C6; padding: 4px 4px 0">Lainnya</span>
    <div style="background: #0F1622; border: 1px solid #233247; border-radius: 22px; overflow: hidden">
      <sc-for list="{{more}}" as="m" hint-placeholder-count="4">
        <a href="{{m.href}}" style="display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 58px; border-top: {{m.sep}}; color: #EAF1F8">
          <span style="width: 38px; height: 38px; border-radius: 11px; background: #172131; color: #EAF1F8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d1}}"></path><path d="{{m.d2}}"></path></svg></span>
          <span style="flex: 1; font-size: 17px; font-weight: 600">{{m.label}}</span>
          <span style="font-size: 15px; color: #A6B4C6">{{m.value}}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" malam="{{ true }}" dark="{{ true }}" active="menu" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var G1 = 'linear-gradient(135deg, #14B8A6 0%, #2F7BEA 100%)', G2 = 'linear-gradient(135deg, #2F7BEA 0%, #6D4AE0 100%)', G3 = 'linear-gradient(135deg, #46576B 0%, #0B1A2B 100%)';
class Component extends DCLogic {
  renderVals() {
    return {
      ws: [['S', 'Pribadi', G3], ['O', 'Divisi Operasional', G2], ['P', 'Proyek Peluncuran Q4', G1]].map(function (w, i) {
        return { l: w[0], name: w[1], grad: w[2], sep: i ? '1px solid #172131' : '0' };
      }),
      more: [
        ['Rapat & notulen', '3 hari ini', 'm16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11', 'M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z'],
        ['Pengajuan saya', '1 menunggu', 'M8 3v4M16 3v4M4 9h16', 'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z'],
        ['Struktur organisasi', '', 'M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20', 'M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'],
        ['Notifikasi', 'Email, aplikasi', 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9', 'M10.3 21a1.94 1.94 0 0 0 3.4 0'],
        ['Tampilan', 'Ikuti sistem', 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z', '']
      ].map(function (m, i) { return { label: m[0], value: m[1], d1: m[2], d2: m[3], href: i === 0 ? 'MRapatMalam.dc.html' : '#', sep: i ? '1px solid #172131' : '0' }; })
    };
  }
}
</script>
</body>
</html>
