<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Riwayat absensi staf · ponsel · mode malam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#5AD6C8;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #EAF1F8; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #070B14">
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em">Riwayat absensi</h1>
    <div role="tablist" aria-label="Bulan" style="display: flex; padding: 4px; border-radius: 16px; background: #1C2838">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{m.sel}}" onClick="{{m.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 12px; background: {{m.bg}}; color: {{m.color}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: {{m.shadow}}">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #0F1622; border: 1px solid #233247; border-radius: 16px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 800; color: {{s.color}}">{{s.v}}</span><span style="font-size: 12px; font-weight: 700; color: #A6B4C6">{{s.l}}</span></div>
      </sc-for>
    </div>
    <div style="background: #0F1622; border: 1px solid #233247; border-radius: 22px; padding: 14px">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
        <sc-for list="{{wd}}" as="w" hint-placeholder-count="7"><span style="font-size: 13px; font-weight: 700; color: #A6B4C6; padding-bottom: 4px">{{w}}</span></sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <span style="height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}">{{c.n}}</span>
        </sc-for>
      </div>
    </div>
    <div style="background: #0F1622; border: 1px solid #233247; border-radius: 22px; overflow: hidden">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{n.sep}}"><span style="width: 44px; text-align: center; font-size: 20px; font-weight: 800">{{n.d}}</span><span style="flex: 1; font-size: 15px; line-height: 21px">{{n.text}}</span><span style="height: 26px; padding: 0 8px; border-radius: 13px; background: {{n.bg}}; color: {{n.fg}}; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap">{{n.kind}}</span></div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><span style="display: block; padding: 14px; font-size: 15px; color: #A6B4C6">Belum ada catatan bulan ini.</span></sc-if>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" malam="{{ true }}" dark="{{ true }}" active="absen" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var K = { ok: ['#0E2A20', '#4ADE9B'], late: ['#2E2210', '#F6B95C'], wfh: ['#0E2A2C', '#5AD6C8'], izin: ['#14223F', '#5B8CF6'], fix: ['#1E1838', '#B8A6FF'] };
var M = {
  'Sep': { label: 'September', first: 1, days: 30, until: 30, today: 0, sp: { 15: 'fix', 18: 'izin', 22: 'late', 29: 'wfh' }, stats: [['19', 'Tepat', '#4ADE9B'], ['1', 'Telat', '#F6B95C'], ['1', 'WFH', '#5AD6C8'], ['1', 'Izin', '#5B8CF6']],
    notes: [['18', 'Izin keluarga, sehari', 'izin', 'Izin'], ['22', 'Masuk 08.12', 'late', 'Telat 12m'], ['29', 'Bekerja dari rumah', 'wfh', 'WFH']] },
  'Okt': { label: 'Oktober', first: 3, days: 31, until: 5, today: 5, sp: {}, stats: [['3', 'Tepat', '#4ADE9B'], ['0', 'Telat', '#F6B95C'], ['0', 'WFH', '#5AD6C8'], ['0', 'Izin', '#5B8CF6']], notes: [] }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { m: 'Sep' };
  }
  renderVals() {
    var self = this;
    var m = (this.state && this.state.m) || 'Sep';
    var c = M[m];
    var cells = [];
    for (var b = 0; b < c.first; b++) cells.push({ n: '', bg: 'transparent', fg: '#EAF1F8' });
    for (var d = 1; d <= c.days; d++) {
      var dow = (d - 1 + c.first) % 7;
      var cell = { n: d, bg: 'transparent', fg: '#7D8FA5' };
      if (d === c.today) cell = { n: d, bg: 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', fg: '#FFFFFF' };
      else if (dow < 5 && d <= c.until) { var k = c.sp[d] || 'ok'; cell = { n: d, bg: K[k][0], fg: K[k][1] }; }
      cells.push(cell);
    }
    return {
      months: Object.keys(M).map(function (k) { var on = k === m; return { label: M[k].label + ' 2026', sel: on ? 'true' : 'false', bg: on ? '#0F1622' : 'transparent', color: on ? '#EAF1F8' : '#A6B4C6', shadow: on ? '0 2px 8px rgba(0,0,0,0.3)' : 'none', pick: function () { self.setState({ m: k }); } }; }),
      stats: c.stats.map(function (s) { return { v: s[0], l: s[1], color: s[2] }; }),
      wd: ['S', 'S', 'R', 'K', 'J', 'S', 'M'],
      cells: cells,
      notes: c.notes.map(function (n, i) { return { d: n[0], text: n[1], kind: n[3], bg: K[n[2]][0], fg: K[n[2]][1], sep: i ? '1px solid #172131' : '0' }; }),
      empty: c.notes.length === 0
    };
  }
}
</script>
</body>
</html>
