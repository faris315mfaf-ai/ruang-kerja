<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard manajemen · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 220px at 0% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(420px 220px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800; color: #09656E">SPKD · MANAJEMEN</span><span style="font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em">Ringkasan</span></span>
      <span style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #14B8A6 0%, #2F7BEA 100%); color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">HW</span>
    </div>

    <div style="border-radius: 24px; padding: 18px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(220px 160px at 100% 0%, rgba(255,255,255,0.22), transparent 70%), linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); box-shadow: 0 14px 30px rgba(30,95,214,0.30)">
      <span style="font-size: 14px; font-weight: 700">Sen, 5 Okt · per 09.40</span>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
        <span style="display: flex; flex-direction: column"><span style="font-size: 36px; line-height: 42px; font-weight: 800">44/48</span><span style="font-size: 14px">hadir · 92%</span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 36px; line-height: 42px; font-weight: 800">23/54</span><span style="font-size: 14px">tugas hari ini selesai</span></span>
      </div>
      <span style="position: relative; display: block; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28)"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 43%; border-radius: 4px; background: #FFFFFF"></span></span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <a href="MgPKerja.dc.html" style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px; color: #0B1A2B"><span style="font-size: 14px; font-weight: 600; color: #46576B">Tugas terlambat</span><span style="font-size: 28px; line-height: 34px; font-weight: 800; color: #C42137">11</span><span style="font-size: 13px; color: #46576B">6 di Programming</span></a>
      <a href="MgPProyek.dc.html" style="border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px; color: #FFFFFF; background: linear-gradient(135deg, #C2410C 0%, #BE185D 100%)"><span style="font-size: 14px; font-weight: 600">Perlu perhatian</span><span style="font-size: 28px; line-height: 34px; font-weight: 800">2 proyek</span><span style="font-size: 13px">KMB · DEP</span></a>
    </div>

    <a href="MgPJadwal.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDE4EC; color: #0B1A2B">
      <span style="width: 52px; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">10.00</span><span style="font-size: 12px; font-weight: 700; color: #46576B">20 mnt lagi</span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">Rapat direksi mingguan</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #46576B"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #EEF2F7; color: #46576B; font-weight: 800; display: inline-flex; align-items: center">Tatap muka</span>notulis Nadia</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8495A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 14px 16px 2px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px"><span style="font-size: 17px; font-weight: 800">Proyek</span><a href="MgPProyek.dc.html" style="font-size: 15px; font-weight: 700">Semua 6</a></div>
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
        <a href="MgPProyek.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-top: 1px solid #EEF2F7; color: #0B1A2B">
          <span style="width: 34px; height: 34px; border-radius: 10px; background: {{p.grad}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.code}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span><span style="font-size: 14px; font-weight: 800; color: {{p.sFg}}">{{p.pct}}%</span></span><span style="position: relative; display: block; height: 6px; border-radius: 3px; background: #EEF2F7"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{p.pct}}%; border-radius: 3px; background: {{p.fill}}"></span></span></span>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" set="manajemen" active="ringkasan" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var G = { teal: 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)', indigo: 'linear-gradient(135deg, #2F7BEA 0%, #6D4AE0 100%)' };
var ST = { ok: ['#0F7A55', 'linear-gradient(90deg, #14B8A6 0%, #2F7BEA 100%)'], warn: ['#9A5800', '#E08A00'], late: ['#C42137', '#C42137'] };
var PR = [['DEP', 'Dashboard Eksekutif Pemda', 30, 'late', 'indigo'], ['KMB', 'Aplikasi Koperasi Maju', 45, 'warn', 'indigo'], ['SIM', 'SIMRS RS Harapan Sehat', 72, 'ok', 'teal'], ['RKJ', 'RuangKerja internal', 88, 'ok', 'teal']];
class Component extends DCLogic {
  renderVals() {
    return { projects: PR.map(function (p) { var s = ST[p[3]]; return { code: p[0], name: p[1], pct: p[2], sFg: s[0], fill: s[1], grad: G[p[4]] }; }) };
  }
}
</script>
</body>
</html>
