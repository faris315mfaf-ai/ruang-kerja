<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jadwal & notulensi · tablet lipat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 884px; height: 1104px; overflow: hidden; display: flex; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(600px 300px at 10% 0%, rgba(20,184,166,0.20), transparent 70%), radial-gradient(600px 300px at 100% 0%, rgba(47,123,234,0.18), transparent 70%), #F3F6FA">
  <div style="width: 96px; height: 1104px; flex-shrink: 0"><dc-import name="Rail" active="jadwal" hint-size="96px,1104px"></dc-import></div>
  <div style="flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Jadwal & notulensi</span><span style="font-size: 15px; color: #46576B">Minggu 41 · 5–9 Oktober 2026</span></span>
      <a href="DRapatBaru.dc.html" aria-label="Jadwalkan rapat" style="height: 48px; padding: 0 18px; border-radius: 14px; background: linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); color: #FFFFFF; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Rapat</a>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div role="tablist" aria-label="Hari" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
            <button type="button" role="tab" aria-selected="{{d.sel}}" onClick="{{d.pick}}" style="height: 62px; border-radius: 16px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 13px; font-weight: 700">{{d.dow}}</span><span style="font-size: 21px; font-weight: 800">{{d.n}}</span></button>
          </sc-for>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; overflow: hidden">
          <sc-for list="{{agenda}}" as="a" hint-placeholder-count="4">
            <a href="{{a.href}}" style="display: flex; gap: 12px; padding: 14px 16px; border-top: {{a.sep}}; color: #0B1A2B">
              <span style="width: 4px; border-radius: 2px; background: {{a.edge}}; flex-shrink: 0"></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 14px; font-weight: 800; color: #46576B">{{a.time}}</span>
                <span style="font-size: 16px; font-weight: 700">{{a.title}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #46576B"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{a.pBg}}; color: {{a.pFg}}; font-weight: 800; display: inline-flex; align-items: center">{{a.place}}</span>{{a.meta}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 16px 16px 4px">
          <span style="display: block; font-size: 19px; font-weight: 800; padding-bottom: 6px">Notulensi terbaru</span>
          <sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
            <a href="DNotulen.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid #EEF2F7; color: #0B1A2B">
              <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 15px; font-weight: 700">{{n.title}}</span><span style="height: 24px; padding: 0 8px; border-radius: 12px; background: {{n.sBg}}; color: {{n.sFg}}; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center">{{n.status}}</span></span>
              <span style="display: flex; align-items: center; gap: 8px"><span style="position: relative; flex: 1; height: 6px; border-radius: 3px; background: #EEF2F7"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{n.pct}}%; border-radius: 3px; background: linear-gradient(90deg, #14B8A6 0%, #2F7BEA 100%)"></span></span><span style="font-size: 13px; font-weight: 700; color: #46576B">{{n.act}}</span></span>
            </a>
          </sc-for>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; padding: 16px 16px 4px">
          <span style="display: block; font-size: 19px; font-weight: 800; padding-bottom: 6px">Tindak lanjut terbuka</span>
          <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EEF2F7">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{a.t}}</span><span style="font-size: 13px; color: #46576B">{{a.who}} · {{a.due}}</span></span>
              <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: {{a.sBg}}; color: {{a.sFg}}; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap">{{a.status}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":884,"height":1104}}'>
var PL = { Meet: ['Google Meet', '#E8FBF8', '#09656E', '#0B7F86'], Zoom: ['Zoom', '#E6EEFE', '#1A4CB0', '#1E5FD6'], Ruang: ['Tatap muka', '#EEF2F7', '#46576B', '#8495A8'], Klien: ['Di klien', '#FFF1DC', '#9A5800', '#C2410C'], Tenggat: ['Tenggat', '#FDE7EA', '#C42137', '#C42137'] };
var D = [
  ['Sen', '5', [['09.30–10.00', 'Stand-up lintas divisi teknis', 'Meet', 'notulen draf', 'DRapat.dc.html'], ['10.00–11.30', 'Rapat direksi mingguan', 'Ruang', 'notulis Nadia', 'DNotulen.dc.html'], ['13.00–14.00', 'Demo SIMRS ke RS Harapan Sehat', 'Zoom', 'Implementer & Analis', 'DRapat.dc.html'], ['14.00–15.00', 'Review arsitektur KMB', 'Meet', 'Programming & Analis', 'DRapat.dc.html']]],
  ['Sel', '6', [['09.00–10.00', 'Review keuangan Q3', 'Ruang', 'Direksi', '#'], ['14.00–15.00', 'Review materi tender Kominfo', 'Meet', 'Branding & Sekretariat', '#']]],
  ['Rab', '7', [['10.00–11.00', 'Persetujuan logo baru SPKD', 'Ruang', '3 alternatif', '#'], ['13.00–14.30', 'Uji beban server SIMRS', 'Meet', 'Programming & Implementer', '#']]],
  ['Kam', '8', [['09.00–11.00', 'Tanda tangan kontrak Sinar Logistik', 'Klien', 'berkas oleh Nadia', '#'], ['13.00–15.00', 'UAT SIMRS sesi 3', 'Klien', 'RS Harapan Sehat', '#']]],
  ['Jum', '9', [['09.30–10.00', 'Stand-up lintas divisi teknis', 'Meet', 'berulang', '#'], ['13.00', 'Kirim materi tender Kominfo', 'Tenggat', 'Branding', '#'], ['15.00–16.00', 'Sprint review KMB', 'Meet', 'demo ke klien', '#']]]
];
var NT = [['Stand-up lintas divisi teknis', 'Draf', 0, 4], ['Retro Sprint 5 KMB', 'Final', 3, 5], ['Persiapan go-live SIMRS', 'Final', 3, 5], ['Eskalasi proyek DEP', 'Final', 1, 3], ['Rapat direksi 28 Sep', 'Final', 4, 6]];
var AC = [['Putuskan perpanjangan DEP', 'Hendra', 'Rab, 7 Okt', 'open'], ['Surati Pemda soal akses API', 'Agus', 'Jum, 2 Okt', 'late'], ['Uji beban server SIMRS', 'Dimas', 'Rab, 7 Okt', 'open'], ['Lengkapi berkas izin usaha', 'Nadia', 'Jum, 30 Okt', 'open'], ['Rekrut 1 programmer KMB', 'Hana', 'Jum, 30 Okt', 'open']];
var AS = { open: ['Berjalan', '#E6EEFE', '#1A4CB0'], late: ['Terlambat', '#FDE7EA', '#C42137'] };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: 0 };
  }
  renderVals() {
    var self = this;
    var di = (this.state && this.state.d) || 0;
    return {
      days: D.map(function (d, i) { var on = i === di; return { dow: d[0], n: d[1], sel: on ? 'true' : 'false', bg: on ? 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0B1A2B', border: on ? '0' : '1px solid #DDE4EC', pick: function () { self.setState({ d: i }); } }; }),
      agenda: D[di][2].map(function (a, i) { var p = PL[a[2]]; return { time: a[0], title: a[1], place: p[0], pBg: p[1], pFg: p[2], edge: p[3], meta: a[3], href: a[4], sep: i ? '1px solid #EEF2F7' : '0' }; }),
      notes: NT.map(function (n) { var fin = n[1] === 'Final'; return { title: n[0], status: n[1], sBg: fin ? '#E3F6EE' : '#FFF1DC', sFg: fin ? '#0F7A55' : '#9A5800', pct: Math.round(n[2] / n[3] * 100), act: n[2] + '/' + n[3] + ' tindak lanjut' }; }),
      actions: AC.map(function (a) { var s = AS[a[3]]; return { t: a[0], who: a[1], due: a[2], status: s[0], sBg: s[1], sFg: s[2] }; })
    };
  }
}
</script>
</body>
</html>
