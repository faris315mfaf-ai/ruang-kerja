<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Beranda · ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FA}
a{color:#09656E;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: radial-gradient(420px 260px at 0% 0%, rgba(20,184,166,0.24), transparent 70%), radial-gradient(420px 260px at 100% 0%, rgba(47,123,234,0.22), transparent 70%), #F3F6FA">
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #09656E">Senin, 5 Oktober</span>
        <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em">Halo, Sari</h1>
      </div>
      <button type="button" aria-label="Profil Sari Wulandari" style="width: 48px; height: 48px; border: 0; padding: 2px; border-radius: 24px; background: linear-gradient(135deg, #14B8A6 0%, #2F7BEA 100%); cursor: pointer"><span style="width: 100%; height: 100%; border-radius: 22px; background: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #0B1A2B">SW</span></button>
    </div>

    <div style="border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF; background: radial-gradient(240px 180px at 100% 0%, rgba(255,255,255,0.24), transparent 70%), linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%); box-shadow: 0 16px 36px rgba(30,95,214,0.32)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.18); font-size: 15px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFE1B0"></span>Belum check-in</span>
        <span style="font-size: 15px; font-weight: 600">Shift 08.00–17.00</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 56px; line-height: 60px; font-weight: 800; letter-spacing: -0.04em">07.48</span>
        <span style="font-size: 16px; font-weight: 600">12 menit lagi</span>
      </div>
      <a href="MAbsen.dc.html" style="height: 54px; border-radius: 16px; background: #FFFFFF; color: #0A4E57; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><path d="M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>Check-in sekarang
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
        <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Tugas hari ini</h2>
        <a href="MTugas.dc.html" style="font-size: 16px; font-weight: 600">Lihat semua</a>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 22px; overflow: hidden">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
          <a href="MTugas.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 72px; border-top: {{t.sep}}; color: #0B1A2B">
            <svg width="24" height="24" viewBox="0 0 20 20" aria-hidden="true" style="flex-shrink: 0"><circle cx="10" cy="10" r="7.5" fill="none" stroke="{{t.color}}" stroke-width="2"></circle><path d="{{t.fill}}" fill="{{t.color}}"></path></svg>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
              <span style="font-size: 15px; color: #46576B"><span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600">{{t.id}}</span> · {{t.ws}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 700; color: {{t.dueColor}}">{{t.due}}</span>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="#" style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 2px; color: #0B1A2B"><span style="font-size: 15px; color: #46576B">Saldo cuti</span><span style="font-size: 28px; font-weight: 700">7 <span style="font-size: 16px; font-weight: 600; color: #46576B">hari</span></span></a>
      <a href="#" style="background: #FFFFFF; border: 1px solid #DDE4EC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 2px; color: #0B1A2B"><span style="font-size: 15px; color: #46576B">Inbox</span><span style="font-size: 28px; font-weight: 700">3 <span style="font-size: 16px; font-weight: 600; color: #46576B">baru</span></span></a>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px"><dc-import name="TabBar" active="beranda" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['PLQ-15', 'Siaran pers peluncuran', 'Peluncuran Q4', 'Lewat 2 hr', '#C42137', '#1E5FD6', 'M10 5a5 5 0 1 1-5 5h5z'],
      ['MSG-23', 'Uji impor data stok batch 2', 'Migrasi gudang', 'Hari ini', '#9A5800', '#B26B00', 'M10 5a5 5 0 0 1 0 10z'],
      ['GDG-52', 'Tata letak rak baru gudang C', 'Tim Gudang', 'Kam', '#46576B', '#46576B', '']
    ];
    return {
      tasks: rows.map(function (r, i) {
        return { id: r[0], title: r[1], ws: r[2], due: r[3], dueColor: r[4], color: r[5], fill: r[6], sep: i ? '1px solid #EEF2F7' : '0' };
      })
    };
  }
}
</script>
</body>
</html>
