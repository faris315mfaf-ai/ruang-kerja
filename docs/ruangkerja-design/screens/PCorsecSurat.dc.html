<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #0B1A2B; font-family: 'Figtree', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #F3F6FA">

    </div>
    <div style="display: flex; gap: 12px">
      <span style="width: 86px; height: 112px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DDE4EC; box-shadow: 0 6px 16px rgba(11,26,43,0.08); padding: 10px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0"><span style="height: 6px; width: 60%; background: #0B1A2B; border-radius: 3px"></span><span style="height: 4px; background: #DDE4EC; border-radius: 2px"></span><span style="height: 4px; background: #DDE4EC; border-radius: 2px"></span><span style="height: 4px; width: 80%; background: #DDE4EC; border-radius: 2px"></span><span style="height: 4px; background: #DDE4EC; border-radius: 2px"></span><span style="height: 4px; width: 50%; background: #DDE4EC; border-radius: 2px"></span><span style="margin-top: auto; font-size: 10px; font-weight: 800; color: #09656E">PDF · 3 hlm</span></span>
      <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; line-height: 26px; font-weight: 800">Undangan tender Dinas Kominfo</span><span style="font-size: 14px; color: #46576B">Diterima Sab, 3 Okt · dipindai dari ponsel</span><span style="font-size: 14px; font-weight: 800; color: #C42137">Batas dokumen Jum, 9 Okt</span></span>
    </div>
    <span style="font-size: 15px; font-weight: 800; padding-top: 4px">Teruskan ke</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">

    <span style="font-size: 15px; font-weight: 800; padding-top: 4px">Instruksi</span>

      <sc-for list="{{ins}}" as="t" hint-placeholder-count="5">
        <button type="button" role="checkbox" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="height: 42px; padding: 0 14px; border-radius: 21px; border: {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{t.label}}</button>

    <span style="font-size: 13px; color: #46576B; text-align: center">{{foot}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TO = ['Direktur Utama', 'Direktur', 'Branding & Marketing', 'Analis', 'Programming'];
var INS = ['Pelajari', 'Siapkan dokumen', 'Hadiri', 'Tanggapi', 'Arsipkan'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { to: { 0: true, 2: true, 3: true }, ins: { 1: true }, sent: false };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var to = st.to || {}, ins = st.ins || {};
    function chip(list, map, key) { return list.map(function (l, i) { var on = !!map[i]; return { label: l, sel: on ? 'true' : 'false', bg: on ? '#E8FBF8' : '#FFFFFF', fg: on ? '#09656E' : '#0B1A2B', border: on ? '2px solid #0B7F86' : '1px solid #DDE4EC', pick: function () { var n = Object.assign({}, map); n[i] = !on; var s = { sent: false }; s[key] = n; self.setState(s); } }; }); }
    var count = Object.keys(to).filter(function (k) { return to[k]; }).length;
    return {
      to: chip(TO, to, 'to'), ins: chip(INS, ins, 'ins'),
      btn: st.sent ? 'Disposisi terkirim ✓' : 'Kirim disposisi ke ' + count + ' tujuan',
      btnBg: st.sent ? 'linear-gradient(135deg, #14B8A6 0%, #0F7A55 100%)' : 'linear-gradient(135deg, #0B7F86 0%, #1E5FD6 100%)',
      foot: st.sent ? 'Masuk ke inbox penerima · tugas dibuat otomatis' : 'Penerima mendapat notifikasi dan salinan PDF',
      send: function () { self.setState({ sent: true }); }
    };
  }
}
</script>
</body>
