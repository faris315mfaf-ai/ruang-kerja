name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, zip, gd, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      # Wayfinder output (resources/js/actions, routes, wayfinder) is gitignored
      # but needed by typecheck and type-aware lint.
      - name: Prepare app & generate Wayfinder types
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: composer lint (Pint + Larastan)
        run: composer lint

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run lint (vp check)
        run: npm run lint

      - name: Agent skills in sync (.agents/skills = .claude/skills)
        run: node scripts/sync-agent-skills.mjs --check

      - name: npm test (Vitest)
        run: npm test
        env:
          # Vitest boots Vite in serve mode; laravel-vite-plugin refuses that
          # when CI=true unless told it is intentional.
          LARAVEL_BYPASS_ENV_CHECK: '1'

  test:
    # ~3.000 tests no longer fit one 20-minute job on a 4-core runner, so the
    # suite is split into time-balanced shards that run side by side.
    name: Pest (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ruangkerja_testing
          POSTGRES_USER: ruangkerja
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruangkerja -d ruangkerja_testing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ruangkerja
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, zip, gd, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Wayfinder's Vite plugin calls `php artisan`, so PHP must be set up first.
      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Pest (shard ${{ matrix.shard }}/3)
        run: |
          php artisan config:clear
          vendor/bin/pest --parallel --shard=${{ matrix.shard }}/3

  build:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Validates the production Dockerfiles; deploy.yml reuses the cache.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      # PostgreSQL 17 + pgBackRest (WAL archiving / PITR, docs/deploy/PITR.md).
      - name: Build postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/postgres/Dockerfile
          push: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Validate compose files
        run: |
          docker compose -f compose.prod.yml --env-file .env.production.example config --quiet
          docker compose -f compose.prod.yml -f compose.shared.yml --env-file .env.production.example config --quiet
          DATA_PRIVATE_IP=10.0.0.2 docker compose -f compose.data.yml --env-file .env.production.example config --quiet
          WEB_PRIVATE_IP=10.0.0.1 docker compose -f compose.web.yml --env-file .env.production.example config --quiet

      # shellcheck is preinstalled on ubuntu-latest.
      - name: Check shell scripts
        run: shellcheck scripts/backup.sh scripts/restore.sh scripts/deploy-remote.sh scripts/server-init-env.sh scripts/pitr.sh scripts/pitr-restore.sh scripts/wal-check.sh scripts/pitr-uji.sh docker/app/entrypoint.sh docker/backup/entrypoint.sh docker/postgres/pgbackrest-archive
