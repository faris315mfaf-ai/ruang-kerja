name: Deploy

# Runs after CI is green on main (or manually). Builds the app + backup images,
# pushes them to GHCR, waits for approval on the `production` environment
# (Settings → Environments → production → Required reviewers), then deploys
# over SSH with scripts/deploy-remote.sh.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   APP_DOMAIN       e.g. absensi.perusahaan.co.id (also the browser Reverb host)
#   REVERB_APP_KEY   public Reverb key, same as REVERB_APP_KEY in the server .env
#   APP_NAME         optional, default RuangKerja
#   DEPLOY_HOST      VPS IP/hostname
#   DEPLOY_USER      e.g. deploy
#   DEPLOY_PORT      optional, default 22
#   DEPLOY_PATH      optional, default /opt/ruangkerja
# Stack layout (own Caddy vs. the shared edge proxy of a VPS shared with other
# projects) is chosen on the server by COMPOSE_FILE in /opt/ruangkerja/.env
# (docs/deploy/VPS-BERSAMA.md); both compose files are uploaded every deploy.
# Environment secrets (environment `production`):
#   DEPLOY_SSH_KEY      private key of the deploy user (ed25519, no passphrase)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "app=ghcr.io/${owner}/ruangkerja"
            echo "backup=ghcr.io/${owner}/ruangkerja-backup"
            echo "collab=ghcr.io/${owner}/ruangkerja-collab"
            echo "tag=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.app }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            VITE_APP_NAME=${{ vars.APP_NAME || 'RuangKerja' }}
            VITE_REVERB_APP_KEY=${{ vars.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ vars.APP_DOMAIN }}
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backup }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backup }}:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      # Catatan bersama (FEATURE_NOTES): Hocuspocus/Yjs server, started on the
      # server with COMPOSE_PROFILES=collab (COLLAB_IMAGE in .env).
      - name: Build & push collab image
        uses: docker/build-push-action@v6
        with:
          context: collab
          file: collab/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.collab }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.collab }}:latest
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ruangkerja' }}
      APP_TAG: ${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Upload compose stack files
        # Variables are meant to expand on the runner (SC2029).
        run: |
          # shellcheck disable=SC2029
          ssh production "mkdir -p '${DEPLOY_PATH}/docker/caddy'"
          scp compose.prod.yml compose.shared.yml "production:${DEPLOY_PATH}/"
          scp docker/caddy/Caddyfile docker/caddy/site.caddy.template "production:${DEPLOY_PATH}/docker/caddy/"

      - name: Log in to GHCR on the server (short-lived job token)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh production "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy (pull, up, migrate, horizon:terminate)
        run: |
          # shellcheck disable=SC2029
          ssh production "DEPLOY_PATH='${DEPLOY_PATH}' APP_TAG='${APP_TAG}' bash -s" < scripts/deploy-remote.sh

      - name: Log out of GHCR on the server
        if: always()
        run: ssh production "docker logout ghcr.io" || true

      - name: Smoke check /health
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health did not return 200 after deploy"
          exit 1
