# Layanan pendukung untuk pengembangan lokal.
# Aplikasi Laravel berjalan di Laravel Herd (Windows), BUKAN di container.
# Jalankan: docker compose up -d   ·   Hentikan: docker compose stop
name: ruangkerja

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Banyak database test paralel (Pest --parallel) butuh slot lock lebih besar dari bawaan 64.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ruangkerja}
      POSTGRES_USER: ${DB_USERNAME:-ruangkerja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: UTC
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ruangkerja} -d ${DB_DATABASE:-ruangkerja}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_FORWARD_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Catatan bersama: server kolaborasi (Hocuspocus/Yjs). Opsional; sehari-hari
  # cukup `composer run dev` (menjalankan collab/ sebagai proses Node di host).
  # Container butuh COLLAB_APP_URL yang terjangkau dari Docker.
  # Jalankan: docker compose --profile collab up -d collab
  collab:
    build: ./collab
    profiles: ["collab"]
    restart: unless-stopped
    environment:
      COLLAB_SECRET: ${COLLAB_SECRET:-}
      COLLAB_PORT: 1234
      COLLAB_APP_URL: ${COLLAB_APP_URL:-http://host.docker.internal:8000}
    ports:
      - "${COLLAB_PORT:-1234}:1234"

  # Video RuangKerja: LiveKit SFU untuk rapat video (docs/SETUP-LOKAL.md "Rapat video").
  # Opsional. Jalankan: docker compose --profile video up -d livekit
  # Browser: wss://livekit.test lewat `herd proxy livekit http://127.0.0.1:7880 --secure`.
  # Kunci & rahasia dibaca dari .env aplikasi (LIVEKIT_API_KEY/SECRET, sama dengan Laravel).
  # Webhook kehadiran → https://${LIVEKIT_WEBHOOK_HOST}/api/livekit/webhook (situs Herd; sertifikat
  # Herd dipercaya lewat folder CA Herd yang di-mount, HERD_CA_DIR).
  livekit:
    image: livekit/livekit-server:v1.13.8
    profiles: ["video"]
    restart: unless-stopped
    environment:
      SSL_CERT_DIR: /herd-ca:/etc/ssl/certs
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-ruangkerja-livekit-dev-secret-0123456789}
        room:
          empty_timeout: 300
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - https://${LIVEKIT_WEBHOOK_HOST:-ruangkerja.test}/api/livekit/webhook
    extra_hosts:
      - "${LIVEKIT_WEBHOOK_HOST:-ruangkerja.test}:host-gateway"
    volumes:
      - "${HERD_CA_DIR:-${HOME}/Library/Application Support/Herd/config/valet/CA}:/herd-ca:ro"
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50100:50000-50100/udp"

volumes:
  pgdata:
  redisdata:
