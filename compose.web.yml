# RuangKerja — VPS "web" (two-server split, docs/deploy/DUA-VPS.md).
#
# Serves everything the browser talks to: Caddy (HTTPS, HTTP/3), the Laravel
# app (Inertia pages + built React/CSS assets), Reverb (WebSocket) and, with
# COMPOSE_PROFILES=collab, the Catatan collab server. Postgres, Redis, Horizon,
# the scheduler and backups run on the "data" VPS (compose.data.yml) and are
# reached over the private network (DB_HOST / REDIS_HOST = data VPS private IP).
#
#   .env: COMPOSE_FILE=compose.web.yml, WEB_PRIVATE_IP=<private IP of this VPS>
name: ruangkerja

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE in .env}:${APP_TAG:-latest}
  restart: unless-stopped
  volumes:
    - ./.env:/app/.env:ro
    - storage:/app/storage
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      APP_ALIASES: ${APP_ALIASES:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    logging: *logging

  app:
    <<: *app
    # FrankenPHP on :8000, only reachable through Caddy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    # Horizon on the data VPS broadcasts here over the private network only.
    ports:
      - "${WEB_PRIVATE_IP:?set WEB_PRIVATE_IP in .env}:8080:8080"
    healthcheck:
      disable: true

  collab:
    image: ${COLLAB_IMAGE:-ghcr.io/ruangkerja/collab}:${APP_TAG:-latest}
    profiles: ["collab"]
    restart: unless-stopped
    environment:
      COLLAB_SECRET: ${COLLAB_SECRET:-}
      COLLAB_PORT: 1234
      COLLAB_APP_URL: http://app:8000
    ports:
      - "${WEB_PRIVATE_IP}:1234:1234"
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  storage:
  caddy_data:
  caddy_config:
